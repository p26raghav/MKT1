<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKT-1 Course Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#23191A; --ink-soft:#4E4340;
    --brick:#8C3A2B; --brick-deep:#5E2419; --brick-wash:#F6EAE6;
    --mortar:#C9BFB4; --hair:#E2DAD1;
    --paper:#FBF9F6; --paper-2:#F3EEE7;
    --slate:#2E4750; --slate-wash:#E9EFF1;
    --good:#2C6A4F; --good-wash:#E7F1EB;
    --bad:#A6392C; --bad-wash:#FAEBE8;
    --rail:262px;
    --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    --body:"Newsreader",Georgia,"Times New Roman",serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
    font-size:17px;line-height:1.6;font-variant-numeric:oldstyle-nums}
  ::selection{background:var(--brick);color:#fff}

  .shell{display:flex;min-height:100vh;align-items:flex-start}
  .rail{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:0;height:100vh;
    background:var(--paper-2);border-right:1px solid var(--hair);padding:24px 16px;
    display:flex;flex-direction:column;gap:20px;overflow-y:auto}
  .brandmark{display:flex;align-items:flex-start;gap:11px}
  .keystone{width:26px;height:34px;flex:0 0 26px;background:var(--brick);
    border-radius:13px 13px 3px 3px;position:relative}
  .keystone::after{content:"";position:absolute;left:7px;right:7px;top:11px;bottom:6px;
    border-radius:6px 6px 1px 1px;background:var(--paper-2)}
  .brand h1{font-family:var(--display);font-size:19px;line-height:1.1;margin:2px 0 3px;
    letter-spacing:-0.02em;font-weight:800}
  .brand p{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft)}

  nav.tabs{display:flex;flex-direction:column;gap:2px}
  .tab{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;
    border:0;cursor:pointer;padding:10px 12px;border-radius:7px;font-family:var(--display);
    font-size:15px;font-weight:600;color:var(--ink-soft);letter-spacing:-0.01em;
    transition:background .16s,color .16s}
  .tab .num{font-family:var(--mono);font-size:10px;color:var(--mortar);font-weight:600}
  .tab .sub{display:block;font-family:var(--body);font-size:12.5px;font-weight:400;
    color:var(--mortar);line-height:1.3;margin-top:1px}
  .tab:hover{background:#EAE3DA;color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--brick);color:#fff}
  .tab[aria-selected="true"] .num,.tab[aria-selected="true"] .sub{color:rgba(255,255,255,.72)}
  .tab:focus-visible{outline:2px solid var(--slate);outline-offset:2px}

  .minitoc{border-top:1px solid var(--hair);padding-top:12px;display:flex;flex-direction:column;gap:1px}
  .minitoc b{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--mortar);margin-bottom:5px;font-weight:600}
  .minitoc a{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);text-decoration:none;
    padding:3px 5px;border-radius:4px;line-height:1.35;cursor:pointer;border:0;background:none;
    text-align:left;display:block}
  .minitoc a:hover{background:#EAE3DA;color:var(--brick)}

  main{flex:1;min-width:0;padding:44px 44px 96px;max-width:1060px}
  .panel[hidden]{display:none}

  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--brick);margin:0 0 8px}
  h2.page{font-family:var(--display);font-size:36px;line-height:1.05;letter-spacing:-0.032em;
    margin:0 0 10px;font-weight:800;max-width:22ch}
  .lede{font-size:18px;color:var(--ink-soft);max-width:64ch;margin:0 0 26px}
  p{margin:0 0 11px;max-width:76ch}
  ul{margin:0 0 12px;padding-left:19px;max-width:76ch}
  li{margin-bottom:5px}
  li::marker{color:var(--mortar)}
  b,strong{font-weight:600}

  /* section */
  .sec{margin:0 0 46px;scroll-margin-top:20px;padding-top:6px}
  .sechead{display:flex;gap:13px;align-items:flex-start;margin-bottom:12px;
    border-top:2px solid var(--ink);padding-top:12px}
  .secnum{width:28px;height:36px;flex:0 0 28px;background:var(--brick);color:#fff;
    border-radius:14px 14px 3px 3px;display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:5px;font-family:var(--mono);font-size:11px;font-weight:600}
  .sectitle{font-family:var(--display);font-size:24px;letter-spacing:-0.022em;margin:0;font-weight:700;line-height:1.12}
  .secsub{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);margin-top:4px}
  h4{font-family:var(--display);font-size:15px;letter-spacing:-0.008em;margin:20px 0 6px;font-weight:700}

  /* tested badge */
  .tested{display:inline-flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
  .tbadge{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:3px 8px;
    border-radius:20px;background:var(--slate-wash);color:var(--slate);border:1px solid #D3DFE3}

  /* tables */
  table{border-collapse:collapse;width:100%;max-width:880px;margin:10px 0 16px;font-size:15.5px}
  th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--hair);vertical-align:top}
  th{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-soft);border-bottom:1px solid var(--ink);font-weight:600}
  tbody tr:nth-child(even){background:var(--paper-2)}
  td:first-child{font-weight:600}
  table.plain td:first-child{font-weight:400}

  /* flow strip */
  .flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:12px 0 16px}
  .fstep{flex:1 1 150px;min-width:140px;background:var(--paper-2);border:1px solid var(--hair);
    border-radius:9px;padding:11px 13px;position:relative}
  .fstep .fk{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--brick);display:block;margin-bottom:3px}
  .fstep .ft{font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.2;display:block}
  .fstep .fd{font-size:14px;color:var(--ink-soft);line-height:1.35;display:block;margin-top:3px}
  .farrow{align-self:center;font-family:var(--mono);color:var(--mortar);font-size:14px}

  /* card grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;margin:10px 0 16px;max-width:880px}
  .card{background:#fff;border:1px solid var(--hair);border-radius:9px;padding:12px 14px}
  .card .ct{font-family:var(--display);font-weight:700;font-size:14.5px;margin-bottom:3px;line-height:1.2}
  .card .cd{font-size:15px;color:var(--ink-soft);line-height:1.4}

  /* two column ledger */
  .ledger{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 16px;max-width:880px}
  .ledger > div{border:1px solid var(--hair);border-radius:9px;padding:13px 15px;background:#fff}
  .ledger .lh{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    margin-bottom:7px;display:block}
  .ledger .plus .lh{color:var(--good)}
  .ledger .minus .lh{color:var(--bad)}
  .ledger ul{margin:0;padding-left:17px}
  .ledger li{font-size:15.5px;margin-bottom:4px}

  /* equation */
  .eqn{background:var(--ink);color:#fff;border-radius:10px;padding:15px 18px;margin:12px 0 16px;
    max-width:880px;font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-0.01em;
    text-align:center;line-height:1.3}
  .eqn small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:6px;font-weight:400}

  /* matrix 2x2 */
  .matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:1px;background:var(--hair);
    border:1px solid var(--hair);border-radius:9px;overflow:hidden;max-width:760px;margin:10px 0 16px}
  .matrix > div{background:#fff;padding:11px 13px;font-size:15px}
  .matrix .mh{background:var(--paper-2);font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center}
  .matrix .mc{font-family:var(--display);font-weight:700;font-size:14.5px}
  .matrix .mc span{display:block;font-family:var(--body);font-weight:400;font-size:14.5px;
    color:var(--ink-soft);margin-top:2px;line-height:1.35}

  /* callouts */
  .callout{border-left:3px solid var(--slate);background:var(--slate-wash);padding:11px 15px;
    border-radius:0 8px 8px 0;margin:12px 0 16px;max-width:820px}
  .callout .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--slate);display:block;margin-bottom:4px}
  .callout p{margin:0}
  .callout.warn{border-left-color:var(--brick);background:var(--brick-wash)}
  .callout.warn .lab{color:var(--brick)}
  .eg{font-size:15.5px;color:var(--ink-soft);max-width:76ch;margin:8px 0 14px;
    padding-left:11px;border-left:1px solid var(--mortar)}
  .eg b{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--brick);margin-right:7px;font-weight:600}

  /* quiz */
  .quizbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    background:var(--paper-2);border:1px solid var(--hair);border-radius:10px;padding:12px 15px;
    margin-bottom:8px;position:sticky;top:0;z-index:5}
  .meter{display:flex;align-items:center;gap:11px}
  .meterbar{width:140px;height:7px;background:var(--hair);border-radius:4px;overflow:hidden}
  .meterfill{height:100%;width:0;background:var(--brick);transition:width .35s}
  .meterlab{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
  .btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
    padding:8px 12px;border-radius:6px;border:1px solid var(--mortar);background:var(--paper);
    color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--brick);border-color:var(--brick);color:#fff}
  .btn:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:6px 11px;border-radius:20px;
    border:1px solid var(--hair);background:var(--paper);cursor:pointer;color:var(--ink-soft)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.paper{border-color:#D3DFE3;background:var(--slate-wash);color:var(--slate)}
  .chip.paper[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}

  .q{border:1px solid var(--hair);border-radius:11px;padding:17px 19px;margin-bottom:13px;background:#fff}
  .qtop{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:7px}
  .qtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--brick)}
  .qsrc{font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:2px 7px;border-radius:20px;
    background:var(--slate-wash);color:var(--slate);margin-left:7px}
  .qnum{font-family:var(--mono);font-size:9.5px;color:var(--mortar)}
  .qprompt{margin:0 0 11px;font-size:16.5px}
  .qdata{margin:0 0 11px}
  .qdata table{margin:0 0 4px;font-size:14.5px;max-width:520px}
  .opts{display:flex;flex-direction:column;gap:6px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:9px 12px;
    border-radius:8px;border:1px solid var(--hair);background:var(--paper);font-family:inherit;
    font-size:15.5px;color:var(--ink);cursor:pointer;line-height:1.4;
    transition:border-color .14s,background .14s}
  .opt .mark{font-family:var(--mono);font-size:11.5px;color:var(--mortar);padding-top:2px;flex:0 0 auto}
  .opt:hover:not(:disabled){border-color:var(--slate)}
  .opt:disabled{cursor:default}
  .opt.correct{background:var(--good-wash);border-color:var(--good)}
  .opt.correct .mark{color:var(--good)}
  .opt.wrong{background:var(--bad-wash);border-color:var(--bad)}
  .opt.wrong .mark{color:var(--bad)}
  .why{margin-top:11px;padding:10px 13px;border-radius:8px;background:var(--paper-2);
    border-left:3px solid var(--slate);font-size:15.5px}
  .why b{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    display:block;margin-bottom:3px;color:var(--slate)}
  .why p{margin:0;max-width:none}
  .doneflag{font-family:var(--mono);font-size:10px;color:var(--good);letter-spacing:.07em}

  @media (max-width:900px){
    .shell{flex-direction:column}
    .rail{width:100%;flex:none;height:auto;position:sticky;top:0;z-index:20;padding:12px 15px;
      border-right:0;border-bottom:1px solid var(--hair);gap:10px;overflow:visible}
    nav.tabs{flex-direction:row;overflow-x:auto;gap:6px;-webkit-overflow-scrolling:touch}
    .tab{white-space:nowrap;padding:8px 12px;font-size:14px}
    .tab .sub{display:none}
    .minitoc{display:none}
    main{padding:24px 16px 70px}
    h2.page{font-size:28px}
    .lede{font-size:16.5px}
    .quizbar{position:static}
    .ledger{grid-template-columns:1fr}
    .matrix{grid-template-columns:auto 1fr;font-size:14px}
    table{font-size:14.5px}
    th,td{padding:7px 8px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ==========================================================
   Imported Frameworks tab — scoped version of the standalone guide
   ========================================================== */
#panel-fw .small,#panel-kit .small{font-size:.86rem;color:var(--ink-soft)}
#panel-fw .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:11px;margin:11px 0 16px;max-width:900px}
#panel-fw .two{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:11px 0 16px;max-width:900px}
#panel-fw .kicker,#panel-kit .kicker{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--brick);background:var(--brick-wash);padding:3px 8px;border-radius:20px;margin-bottom:7px}
#panel-fw .eq{background:var(--ink);color:#fff;border-radius:10px;padding:14px 18px;margin:12px 0 16px;max-width:880px;font-family:var(--display);font-size:19px;font-weight:600;text-align:center}
#panel-fw .flow{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap;margin:11px 0 16px;max-width:900px}
#panel-fw .flow .node{flex:1;min-width:125px;background:#fff;border:1px solid var(--hair);border-radius:9px;padding:11px;text-align:center;font-family:var(--display);font-weight:700;font-size:14px;line-height:1.25}
#panel-fw .flow .arrow{display:flex;align-items:center;color:var(--mortar);font-family:var(--mono);font-size:15px}
#panel-fw .diagram{background:#fff;border:1px solid var(--hair);border-radius:10px;padding:13px;overflow:auto;margin:11px 0 16px;max-width:900px}
#panel-fw .diagram svg{max-width:100%;height:auto}
#panel-fw .legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
#panel-fw .legend span,#panel-fw .badge{display:inline-block;font-family:var(--mono);font-size:9.5px;padding:3px 8px;border-radius:20px;background:var(--slate-wash);color:var(--slate);margin:2px}
#panel-fw section[data-search]{margin:0 0 44px;scroll-margin-top:20px;padding-top:5px}
#panel-fw section[data-search] > h2{font-family:var(--display);font-size:25px;letter-spacing:-.022em;margin:0 0 13px;padding-top:12px;border-top:2px solid var(--ink);font-weight:700;line-height:1.12}
#panel-fw .callout{max-width:880px}
#panel-fw .card.tight{padding:11px 12px}
#panel-fw table{max-width:900px}

/* ==========================================================
   Case summaries — horizontal expandable cards
   ========================================================== */
#panel-kit .horizontal-cases{display:flex;gap:12px;overflow-x:auto;padding:5px 2px 18px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
#panel-kit .horizontal-cases::-webkit-scrollbar{height:9px}
#panel-kit .horizontal-cases::-webkit-scrollbar-thumb{background:var(--mortar);border-radius:999px}
#panel-kit .case-expand{flex:0 0 310px;scroll-snap-align:start;cursor:pointer;transition:flex-basis .25s ease,box-shadow .2s ease,transform .15s ease;min-height:260px}
#panel-kit .case-expand:hover{transform:translateY(-2px)}
#panel-kit .case-expand.expanded{flex-basis:min(760px,88vw);box-shadow:0 12px 30px rgba(35,25,26,.12)}
#panel-kit .case-long{max-height:390px;overflow:hidden;position:relative}
#panel-kit .case-long:after{content:"";position:absolute;left:0;right:0;bottom:0;height:65px;background:linear-gradient(transparent,#fff)}
#panel-kit .case-expand.expanded .case-long{max-height:none}
#panel-kit .case-expand.expanded .case-long:after{display:none}
#panel-kit .expand-hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--brick);margin-top:9px}
#panel-kit .case-summary h3{font-family:var(--display);font-size:20px;line-height:1.15;margin:0 0 10px}
#panel-kit .case-summary p{font-size:15.5px;line-height:1.52;margin:0 0 10px;max-width:none}
#panel-kit .case-summary .callout{margin-top:12px}
@media(max-width:900px){
  #panel-fw .two{grid-template-columns:1fr}
  #panel-fw .flow .arrow{display:none}
  #panel-kit .case-expand{flex-basis:82vw}
  #panel-kit .case-expand.expanded{flex-basis:92vw}
}


/* ===== Single-case reader ===== */
.case-reader{max-width:880px}
.case-switcher{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
.case-switcher .case-count{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mortar)}
.case-detail{background:#fff;border:1px solid var(--hair);border-radius:11px;padding:20px 22px}
.case-detail h3{font-family:var(--display);font-size:25px;line-height:1.12;letter-spacing:-.02em;margin:0 0 14px}
.case-detail p{max-width:none}
.case-nav-buttons{display:flex;gap:8px}
.case-nav-buttons .btn:disabled{opacity:.35;cursor:default}
#minitoc.case-toc a{padding:6px 7px}
#minitoc.case-toc a.active{background:var(--brick);color:#fff}
#minitoc.case-toc a.active .case-no{color:rgba(255,255,255,.72)}
.case-no{font-family:var(--mono);font-size:9px;color:var(--mortar);margin-right:5px}
#minitoc.empty{display:none}


/* ===== Essential Readings ===== */
.reading-wrap{max-width:900px}
.reading-intro{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.reading-intro span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 8px;border-radius:20px;background:var(--slate-wash);color:var(--slate)}
.read-sec{margin:0 0 38px;scroll-margin-top:18px;border-top:2px solid var(--ink);padding-top:12px}
.read-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
.read-ch{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--brick);border-radius:16px 16px 3px 3px;padding:5px 8px;white-space:nowrap}
.read-title{font-family:var(--display);font-size:22px;line-height:1.15;letter-spacing:-.018em;font-weight:700}
.read-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;margin-top:9px}
.read-box{border:1px solid var(--hair);border-radius:9px;background:#fff;padding:12px 14px}
.read-box h4{margin:0 0 7px;font-size:14.5px}
.read-box ul{margin:0;padding-left:18px}
.read-box li{font-size:15px;line-height:1.4;margin-bottom:5px}
.exam-trap{border-left:3px solid var(--brick);background:var(--brick-wash);border-radius:0 8px 8px 0;
  padding:10px 13px;margin-top:10px;font-size:15px}
.quiz-link{font-family:var(--mono);font-size:9.5px;color:var(--good);letter-spacing:.04em;margin-top:8px}
.priority{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 7px;border-radius:20px;margin-left:6px}
.priority.high{background:#FAE7E3;color:var(--brick-deep)}
.priority.med{background:#F2EEE8;color:var(--ink-soft)}

/* ===== Rich learning mode for Essential Readings ===== */
.reading-wrap{max-width:940px}

.learning-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}

.learn-card h4{font-family:var(--display);font-size:16px;margin:0 0 5px}

.rd-diagram{background:linear-gradient(180deg,#fff,#fbfaf8);border:1px solid var(--hair);border-radius:12px;padding:15px;margin:13px 0}
.rd-flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.rd-node{flex:1;min-width:112px;padding:10px 8px;border:1px solid #d8d1c7;border-radius:8px;text-align:center;background:#fff}

.rd-node small,.method-grid small,.mix-grid small,.brand-tree small,.pricing-grid small,.sixm small,.pushpull small{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px}
.rd-arrow{display:flex;align-items:center;justify-content:center;color:var(--brick);font-size:20px;font-weight:700}
.rd-caption{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:10px}
.rd-wheel{width:250px;height:250px;border:2px solid var(--brick);border-radius:50%;margin:18px auto 3px;position:relative;display:grid;place-items:center;text-align:center}
.rd-wheel b{font-family:var(--display)}
.rd-wheel span{position:absolute;font-size:11px;background:#fff;border:1px solid var(--hair);padding:4px 7px;border-radius:14px}
.rd-wheel span:nth-child(1){top:-8px}.rd-wheel span:nth-child(2){right:-34px}.rd-wheel span:nth-child(3){bottom:-8px}.rd-wheel span:nth-child(4){left:-36px}
.risk-grid,.seg-quad,.mix-grid,.pricing-grid,.sixm,.method-grid,.pushpull{display:grid;gap:8px;margin-top:12px}
.risk-grid{grid-template-columns:repeat(6,1fr)}
.risk-grid span,.seg-quad span,.mix-grid span,.sixm span{background:var(--slate-wash);border-radius:8px;padding:9px;text-align:center;font-size:12px}
.buying-map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:650px;margin:auto;position:relative}
.buying-map b{grid-column:1/-1;text-align:center;font-family:var(--display);font-size:18px;margin-bottom:2px}
.buying-map span{padding:9px;border:1px solid var(--hair);border-radius:8px;text-align:center;background:#fff}
.method-grid{grid-template-columns:repeat(3,1fr)}
.method-grid>div,.pricing-grid>div,.pushpull>div{border:1px solid var(--hair);border-radius:8px;padding:10px;text-align:center;background:#fff}
.seg-quad,.mix-grid{grid-template-columns:repeat(4,1fr)}
.position-stack{display:grid;gap:7px;max-width:660px;margin:auto}
.position-stack>div{padding:10px 12px;border-left:4px solid var(--brick);background:#fff;border-radius:0 8px 8px 0}
.position-stack small{display:block;color:var(--ink-soft);margin-top:2px}
.range{margin-top:14px;display:grid;grid-template-columns:1fr 2fr 1fr;gap:6px;align-items:center;text-align:center}
.range i{padding:11px;border:2px solid var(--brick);border-radius:9px;background:#fff;font-style:normal}
.range small{grid-column:1/-1;color:var(--ink-soft)}
.brand-tree{text-align:center;max-width:650px;margin:auto}
.brand-tree .master{display:inline-block;border:2px solid var(--ink);padding:8px 14px;border-radius:8px;font-family:var(--display);font-weight:700}
.brand-tree .branch{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.brand-tree .branch span{border:1px solid var(--hair);background:#fff;border-radius:8px;padding:10px}
.pricing-grid{grid-template-columns:repeat(3,1fr)}
.digital-funnel{display:grid;gap:6px;max-width:650px;margin:auto;text-align:center}
.digital-funnel div{padding:9px 12px;border:1px solid var(--hair);background:#fff;border-radius:8px}
.digital-funnel div:nth-child(1){margin:0 12%}.digital-funnel div:nth-child(2){margin:0 8%}.digital-funnel div:nth-child(3){margin:0 4%}
.gate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:5px 12% 0;text-align:center}
.gate-row span{font-family:var(--mono);font-size:9px;color:var(--brick);border-top:2px dashed var(--brick);padding-top:3px}
.sixm{grid-template-columns:repeat(6,1fr)}
.pushpull{grid-template-columns:1fr 1fr}
.read-example,.exam-lens{padding:11px 13px;border-radius:9px;margin-top:10px}
.read-example{background:#F7F3ED;border:1px solid var(--hair)}
.exam-lens{background:var(--brick-wash);border-left:4px solid var(--brick)}
.read-example b,.exam-lens b{font-family:var(--display)}
.read-example p,.exam-lens p{margin:4px 0 0;font-size:14.5px;line-height:1.45}
@media(max-width:760px){
  .learning-grid{grid-template-columns:1fr}
  .risk-grid,.sixm{grid-template-columns:repeat(2,1fr)}

  .rd-arrow{display:none}
  .range{grid-template-columns:1fr}
  .range small{grid-column:auto}
  .buying-map{grid-template-columns:repeat(2,1fr)}
}

        <span class="num">02</span><span>Practice</span></button>

        <span class="num">03</span><span>Case Summaries</span></button>

        <span class="num">04</span><span>Essential Readings</span></button>
    </nav>

  </aside>
  <main>
    <section class="panel" id="panel-fw" role="tabpanel" aria-labelledby="tab-fw"></section>
    <section class="panel" id="panel-drill" role="tabpanel" aria-labelledby="tab-drill" hidden></section>
    <section class="panel" id="panel-kit" role="tabpanel" aria-labelledby="tab-kit" hidden></section>
    <section class="panel" id="panel-read" role="tabpanel" aria-labelledby="tab-read" hidden></section>
  </main>

<script>
/* =====================================================================
   FRAMEWORKS
   block types: p | list | table | cards | flow | ledger | eqn | matrix
                | callout | eg | h
   ===================================================================== */
const FW = [
{n:"01", id:"f1", title:"The marketing logic", sub:"How the whole course fits together",
 tested:["2025 Q22","2021 Q8"],
 blocks:[
  {t:"p", v:"Marketing starts with the customer's need, not with the product. A product is only one possible way of satisfying a need. The firm creates value for a chosen customer, then captures part of it back through price."},
  {t:"flow", v:[
    ["Step 1","5Cs","Understand the market"],
    ["Step 2","STP","Choose where to play"],
    ["Step 3","4Ps","Design and deliver the offering"],
    ["Step 4","Perceived value","Create it, then capture it"],
    ["Step 5","Advantage","Defend it against imitation"]]},
  {t:"eqn", v:"Customer Perceived Value = Perceived Benefits &minus; Perceived Costs", s:"Both terms are perceived"},
  {t:"callout", lab:"The one question", v:"How can a firm create more perceived value for a carefully chosen customer than the relevant alternatives, communicate it clearly, capture part of it economically, and do so in a way competitors cannot easily copy? An answer that misses any clause is incomplete."}]},

{n:"02", id:"f2", title:"Four orientations to the market", sub:"Diagnosing a firm in one line",
 tested:["2025 Q14","2025 Q22"],
 blocks:[
  {t:"table", head:["Orientation","Starting point","Main obsession","Typical risk"], rows:[
   ["Production","Efficiency and scale","Make it cheaply and make a lot of it","Customer needs get ignored"],
   ["Product","Technical superiority","Build the best possible product","Better engineering is not higher value. This is marketing myopia"],
   ["Selling","Existing inventory","Push it out through persuasion, discounts and sales force","Short-term volume without product market fit"],
   ["Marketing","Customer need","Design the offering around the market","Requires deeper research and real trade-offs"]]},
  {t:"callout", lab:"Exam pattern", v:"These come as two quoted statements to classify. A strong sales force with persuasive advertising and frequent promotions is the selling concept. Highlighting innovative features and cutting-edge technology is the product concept. Defining the business as a solutions provider rather than a product maker is the marketing concept."},
  {t:"eg", v:"Investors pushing wellness packages for margin are marketing oriented. A founder who just wants vegetables available at lowest cost is production oriented."}]},

{n:"03", id:"f3", title:"Needs, wants and demand", sub:"Three words that are not synonyms",
 tested:["2025 Q15","2021 Q5"],
 blocks:[
  {t:"cards", v:[
   ["Need","An underlying motive, tension or desired progress. Usually psychological. Marketers do not create needs."],
   ["Want","A specific way of satisfying that need, shaped by culture and personality. Marketers do create wants."],
   ["Demand","A want backed by the ability and willingness to pay. This is the distinction that gets tested."],
   ["Stated need","What the customer says out loud, such as asking for onboard GPS."],
   ["Latent or unfelt need","Real but unarticulated, because the behaviour is habitual or subconscious."],
   ["Job to be done","What progress is the customer trying to make? Widens the competitor set beyond the category."]]},
  {t:"callout", lab:"The classic trap", v:"A luxury car that many people admire but few can afford is a want for many and a demand for only a few who have the ability to pay. It is not non-existent demand, and it is not latent demand."},
  {t:"h", v:"Laddering"},
  {t:"flow", v:[
    ["","Attribute","The concrete feature"],
    ["","Functional consequence","What it does for me"],
    ["","Emotional consequence","How it makes me feel"],
    ["","Higher-order value","What it says about who I am"]]},
  {t:"p", v:"Keep asking why is that important. Customers open with features while the real driver is emotional or symbolic."}]},

{n:"04", id:"f4", title:"Perceived value: benefits and costs", sub:"The central ledger",
 tested:["2025 Q23","2025 Q27","2025 Q19"],
 blocks:[
  {t:"ledger", plus:["Product or functional benefit: performance, reliability, convenience, durability, safety, speed, quality",
   "Service benefit: installation, delivery, maintenance, after-sales support, availability, customisation",
   "Personnel benefit: staff expertise, friendliness, trust, relationship quality, responsiveness",
   "Image or symbolic benefit: prestige, identity, self-expression, belonging, social signalling, status"],
   minus:["Monetary cost: price, fees, maintenance, subscription, installation",
   "Time cost: waiting, searching, learning, travel, setup",
   "Energy or effort cost: physical work, mental effort, complexity, switching effort",
   "Psychological cost: anxiety, uncertainty, perceived risk, cognitive overload",
   "Social cost: stigma, identity conflict, peer perception, loss of status"]},
  {t:"p", v:"Only two levers exist. Raise perceived benefits, or reduce perceived costs, or do both. Objective quality matters only through what customers actually perceive."},
  {t:"h", v:"Types of perceived risk"},
  {t:"table", head:["Risk","What the buyer fears"], rows:[
   ["Physical","The product will harm my body or health"],
   ["Functional or performance","It will not work as promised"],
   ["Financial","I will lose money, or it is not worth the price"],
   ["Time","I will waste time buying, learning or replacing it"],
   ["Social","People will judge me for it"],
   ["Psychological","It does not fit the person I think I am"]]},
  {t:"eg", v:"Using an unbranded cosmetic and worrying about a skin reaction is physical risk. Refusing to switch operating systems because the new interface is hard to learn is an effort cost, not a monetary one, which is why a discount does not fix it."},
  {t:"callout", lab:"Context can subtract value", v:"A benefit in one culture is a cost in another. A plant-based product engineered to perfectly mimic meat can lower perceived value for a consumer whose vegetarianism is a cultural or religious commitment."}]},

{n:"05", id:"f5", title:"Satisfaction, and why value is relative", sub:"A comparison, not a level",
 tested:["2025 Q26"],
 blocks:[
  {t:"eqn", v:"Satisfaction = Perceived performance vs Expectation", s:"Below is dissatisfaction, level is satisfaction, above is delight"},
  {t:"p", v:"The targeting consequence: a technically imperfect product can succeed with a segment whose expectations match current performance, while a high-expectation segment rejects the same product. This is why expectation fit is a formal targeting criterion."},
  {t:"h", v:"Value is always comparative"},
  {t:"list", v:["Customers compare against other brands, substitutes, the current solution, doing nothing, expected norms and prior experience.",
   "Doing nothing is a real competitor and the one most answers forget.",
   "Value is subjective, meaning personal interpretation, and intersubjective, meaning socially shared. A logo signals only because a group agrees on what it signals.",
   "So a marketing task is not only to build value but to manage how value is perceived."]}]},

{n:"06", id:"f6", title:"Consumer behaviour", sub:"Why buyers are not calculators",
 tested:["2025 Q24"],
 blocks:[
  {t:"cards", v:[
   ["External influences","Social groups, family, culture, social class, media, and the marketing mix itself."],
   ["Internal influences","Need and motive, learning, personality, perception, attitude."],
   ["Cognitive misers","People avoid mental effort and use heuristics, emotion and context cues. This produces framing effects, brand shortcuts and popularity cues."],
   ["Choice overload","More options raises comparison difficulty and regret, which lowers conversion. A smaller assortment can raise clarity and confidence."]]},
  {t:"h", v:"Maslow's hierarchy"},
  {t:"table", head:["Level","What it covers","Buying example"], rows:[
   ["Self-actualisation","Fulfilment, meaning, realising potential","A course taken purely out of curiosity"],
   ["Ego or esteem","Status, prestige, recognition, self-esteem","Buying a luxury good as a status symbol"],
   ["Social","Affection, friendship, belonging","Group travel, shared subscriptions"],
   ["Safety and security","Protection, stability, order","Insurance, a car chosen for safety ratings"],
   ["Physiological","Food, water, shelter, survival","Staples"]]},
  {t:"h", v:"Tri-component attitude model"},
  {t:"table", head:["Component","Question it answers"], rows:[
   ["Cognitive","What does the consumer think or believe?"],
   ["Affective","What does the consumer feel?"],
   ["Conative","What does the consumer intend to do?"]]},
  {t:"p", v:"The three are related but not identical, which is why someone can believe your product is best, feel nothing for it, and never buy."}]},

{n:"07", id:"f7", title:"Social class, NCCS and lifestyle", sub:"Where taste comes from",
 blocks:[
  {t:"list", v:["Social class reflects wealth, status, prestige, power and social position, and it shapes taste, language, product choice and identity.",
   "Ascribed position is inherited. Achieved position is earned through education, work or wealth. Movement between them is social mobility, upward or downward.",
   "NCCS, the New Consumer Classification System, classifies Indian households using education of the chief wage earner and household durable ownership. It captures mobility and taste better than income alone. It replaced SEC, which graded A1 down to E.",
   "Old money and new money consume differently. Subtle against overt signalling, different cultural capital. Wealth does not imply an identical consumption style.",
   "Lifestyle is a pattern of consumption goals and ways of living shaped by culture, class, ideology and personal preference."]}]},

{n:"08", id:"f8", title:"The 5Cs", sub:"Analysis before any decision",
 tested:["2025 Q7","2025 Q10"],
 blocks:[
  {t:"table", head:["C","Question it asks","What lives here"], rows:[
   ["Company","What can we actually do well?","Capabilities, assets, culture, cost structure, right to win"],
   ["Customers","What needs are we trying to satisfy?","Segments, perceived value, buying behaviour, willingness to pay"],
   ["Competitors","Who else satisfies the same need?","Direct rivals, substitutes, and anything competing for the same budget"],
   ["Collaborators","Who do we need on our side, and why would they join?","Channels, suppliers, distributors, installers, complementors, partners"],
   ["Context","What outside forces limit what is possible?","Cultural, social, economic, technological, legal and regulatory"]]},
  {t:"callout", lab:"Exam pattern", v:"These come as a scenario asking which C is being prioritised, or which two Cs create the tension. Tariffs, emission regulations and the cultural meaning of car ownership are all Context. R and D capability clashing with what customers expect is Company against Customers."},
  {t:"p", v:"Value exchange runs both ways. The firm creates value for customers and captures part of it through price. Collaborators also need a reason to participate, and the sweet spot where company, customer and collaborator all gain is the optimum value proposition, a win-win-win."}]},

{n:"09", id:"f9", title:"Segmentation", sub:"Cutting a heterogeneous market",
 tested:["2025 Q17","2025 Q25","2021 Q1","2021 Q6"],
 blocks:[
  {t:"p", v:"Divide a broad market into groups that are relatively homogeneous within and meaningfully heterogeneous across. The concept is easy. The choice of basis is the skill."},
  {t:"table", head:["B2C basis","Variables","Recognise it by"], rows:[
   ["Geographic","Country, region, urban or rural, climate, locality","Smaller packs for rural markets, zonal tea against coffee"],
   ["Demographic","Age, gender, occupation, income, education, household structure","Kids against adults, men against women"],
   ["Behavioural","User status, usage rate, purchase frequency, loyalty, readiness to buy","Heavy users, competitive marathon runners, first-time buyers"],
   ["Psychographic","Personality, values, lifestyle, attitudes, aspirations, identity","Health-conscious consumers, adventure seekers"],
   ["Benefit or need based","The outcome sought: convenience, economy, status, safety, indulgence","Cruise passengers split by gambling, fun, adventure or education"]]},
  {t:"table", head:["B2B basis","Variables"], rows:[
   ["Macro (firmographic)","Industry, customer type, organisation size, usage rate, geography, end use or application"],
   ["Micro","Buying situation, purchasing criteria, customer capabilities, purchasing policies, risk attitude, characteristics of the decision participants"]]},
  {t:"callout", lab:"The distinction that gets tested", v:"Segmentation variables create the segments. Profiling variables describe them afterwards. Needs, attitudes, benefits sought and utilities create. Age, education, occupation, class, family size and geography describe. Getting this backwards is the most common segmentation error, and it is why demographic-only segmentation is weak."},
  {t:"h", v:"A good segment is"},
  {t:"cards", v:[
   ["Distinct or differentiable","It responds differently, so it deserves a different approach"],
   ["Measurable or definable","You can identify and size it"],
   ["Accessible","You can reach and serve it"],
   ["Substantial or profitable","It is large and valuable enough to be worth serving"],
   ["Actionable","You can actually do something different for it"]]}]},

{n:"10", id:"f10", title:"Targeting", sub:"Choosing where to play",
 tested:["2025 Q12","2021 Q3","2021 Q7","2021 Q11","2021 Q12"],
 blocks:[
  {t:"table", head:["Targeting strategy","What it means","Signal in a question"], rows:[
   ["Undifferentiated or mass","One offer for the whole market, or many broad demographic groups seeking the same benefit","No tailoring of product or message"],
   ["Differentiated","Separate offers and mixes for several segments","Different variants, different channels, different price points"],
   ["Concentrated or niche","All resources on one narrow distinctive segment","A distinctive crowd and a distinctive assortment"],
   ["Micromarketing","Local or individual level customisation","One-to-one, or store-by-store tailoring"]]},
  {t:"h", v:"Four fit tests"},
  {t:"cards", v:[
   ["Market attractiveness","Size, growth, profitability, willingness to pay, rivalry, substitutes, buyer power. Also entry and exit barriers."],
   ["Company fit","Ability to serve, product performance, channel access, brand credibility, resources."],
   ["Competitive fit","Incumbents, barriers, likely retaliation. Red ocean against blue ocean."],
   ["Expectation fit","The higher the expectations, the harder it is to satisfy with an immature offering."]]},
  {t:"callout", lab:"Two tested rules", v:"An attractive segment tends to have high entry barriers and low exit barriers. And effective target marketing means not scattering your effort across everyone."}]},

{n:"11", id:"f11", title:"Positioning", sub:"Owning an idea in the mind",
 tested:["2025 Q11","2025 Q34","2025 Q12","2021 Q4","2021 Q2"],
 blocks:[
  {t:"p", v:"Positioning is the distinct space a brand occupies in the target customer's mind, relative to alternatives. It is perception, not engineering reality, and it is expressed in one sentence rather than a feature list."},
  {t:"eqn", v:"Our brand is the [single most important claim] among all [competitive frame] because [single most important support]", s:"The positioning statement template"},
  {t:"table", head:["Term","Meaning","Test"], rows:[
   ["Point of parity (POP)","Category basics required for legitimacy","Without it you are not even considered"],
   ["Point of difference (POD)","The distinctive, relevant reason to prefer you","Desirable, differentiated, credible, ideally sustainable"],
   ["Reason to believe (RTB)","Evidence that you can actually deliver the promise","A white space with no RTB is a fantasy"],
   ["Unique selling proposition (USP)","The statement of why a consumer should buy this brand rather than a competitor",""]]},
  {t:"h", v:"The twelve-step process"},
  {t:"list", v:["Define the competition set. Understand target needs. Assess current competitive positioning. Assess current customer perception.",
   "Identify possible perceptual dimensions. Map competitors. Identify white spaces.",
   "Check reason to believe. Develop concepts. Test concepts. Write the positioning statement. Align the 4Ps."]},
  {t:"h", v:"Perceptual maps"},
  {t:"list", v:["Good axes reflect a real customer trade-off. Avoid axes where one end is obviously good and the other obviously bad, because nobody would choose the bad end and the map tells you nothing.",
   "A white space is not automatically attractive. It may be empty because nobody wants it or because nobody can credibly serve it.",
   "Two axes fit on a board, but the real space is multidimensional. If the two obvious axes hide the story, add a third.",
   "Axes used in class: premium against affordable, traditional against modern, health against beauty, routine against vacation, feminine against masculine, conformist against adventurous, rugged against sophisticated, functional against emotional."]},
  {t:"callout", lab:"Exam pattern", v:"You are shown a map with competitor brands clustered in three quadrants and asked where to position. The answer is the empty quadrant, phrased in the language of both axes. If rivals occupy nutrition-for-kids, energy-for-kids and nutrition-for-adults, the answer is energy for adults."},
  {t:"h", v:"Concept testing criteria"},
  {t:"p", v:"Resonance, motivation to try, repeat potential, clarity, communicability, differentiation, long-term brand equity. A concept can resonate strongly and still fail on differentiation or equity, so test all seven."},
  {t:"h", v:"Brand awareness"},
  {t:"table", head:["Term","Definition"], rows:[
   ["Brand recall","Retrieved without a cue"],
   ["Brand recognition","Identified when shown a cue"],
   ["Top of mind","The first brand named in the category"]]},
  {t:"p", v:"Awareness is not liking, preference or loyalty. Measurement of brand meaning uses word association, sentence completion, animal metaphors, celebrity association, personification, user imagery, projective techniques, semantic differential scales and perceptual mapping."}]},

{n:"12", id:"f12", title:"Diffusion of innovation", sub:"Who adopts when, and where products die",
 tested:["2025 Q13","2025 Q16","2021 Q15"],
 blocks:[
  {t:"flow", v:[
   ["2 to 3%","Innovators","Tech enthusiasts, tolerate flaws, buy on novelty"],
   ["~13%","Early adopters","Visionaries who become proof points"],
   ["~34%","Early majority","Pragmatists, want proof and reliability"],
   ["~34%","Late majority","Sceptics, adopt under social or practical pressure"],
   ["~16%","Laggards","Adopt last, often only when forced"]]},
  {t:"callout", lab:"The chasm", v:"The gap sits between early adopters and the early majority. Early adopters tolerate imperfection and enjoy novelty. The mainstream wants reliability, proof, compatibility and low risk. They are different segments with different expectations, which is why most new products stall here."},
  {t:"h", v:"What a new product needs beyond being good"},
  {t:"p", v:"Awareness, comprehension, trial, trust, compatibility, channel support, repeat use. Demonstration is especially powerful when operation is unfamiliar or the benefit has to be seen, which is why a video or in-store working display beats a print description for something like a robotic mop."},
  {t:"callout", lab:"Exam pattern", v:"You are given an adoption story and asked which statement is an incorrect application of the model. Watch for a group being placed in the wrong category, such as calling tech enthusiasts laggards, or claiming early adopters only arrived after a mass-market trigger."}]},

{n:"13", id:"f13", title:"The 4Ps", sub:"Execution of the chosen position",
 tested:["2021 Q13"],
 blocks:[
  {t:"table", head:["P","What it controls","Typical question"], rows:[
   ["Product","Features, bundle, brand, design, quality, service, warranty","Which benefits are we delivering, and what is excluded?"],
   ["Price","Value capture, tariff structure, discounting, reference price","What is willingness to pay? Fixed or variable? Skim or penetrate?"],
   ["Place","Distribution, channels, availability, convenience, transportation","Where is it sold, through whom, and what does the intermediary do?"],
   ["Promotion","Communication, awareness, persuasion, education","Push or pull? Which medium demonstrates the benefit best?"]]},
  {t:"callout", lab:"Watch the wording", v:"Cost-effective transportation of products to customers is Place, not Product. Anything about getting the offer physically or digitally to the buyer sits in Place."}]},

{n:"14", id:"f14", title:"Product decisions and the product mix", sub:"Width, length, depth, consistency",
 tested:["2025 Q4","2021 Q10"],
 blocks:[
  {t:"table", head:["Dimension","Definition"], rows:[
   ["Width","The number of different product lines the company carries"],
   ["Depth","The number of items or variants within a product line"],
   ["Length","The total number of items across all lines"],
   ["Consistency","How closely related the lines are in use, production or channel"]]},
  {t:"callout", lab:"Known ambiguity, read the options", v:"Some textbooks reserve length for the number of items in a single line and use depth only for variants of one item. The MKT-1 paper pairs width with depth for the number of items within a line. If both Width and Depth and Width and Length appear as options, go with width and depth."},
  {t:"h", v:"Product line decisions"},
  {t:"list", v:["Line breadth: how many different lines to offer, guided by how consistent you want the portfolio to be.",
   "Line length: how many items across price points.",
   "Line depth: how many variants of a given item.",
   "Adding a new line is usually about capturing new markets. Ask whether it complements existing products or cannibalises them, and what it does to brand equity."]},
  {t:"h", v:"Product life cycle"},
  {t:"flow", v:[["","Introduction","Low volume, high cost, build awareness and trial"],
   ["","Growth","Adoption accelerates, competitors enter"],
   ["","Maturity","Volume peaks, differentiation and defence matter most"],
   ["","Decline","Harvest, reposition or exit"]]},
  {t:"h", v:"Cannibalisation"},
  {t:"p", v:"When a new product takes sales from your own existing product. Ask four questions. Would the customer otherwise switch to a competitor? Is the new product more profitable? Is the market migrating anyway? Should you control the transition yourself rather than let a rival run it?"}]},

{n:"15", id:"f15", title:"Pricing", sub:"Capturing the value you created",
 tested:["2025 Q5","2025 Q21"],
 blocks:[
  {t:"p", v:"Perceived value is the ceiling on price. Cost is the floor. Everything between the two is negotiation."},
  {t:"table", head:["Strategy","What it does","When it fits"], rows:[
   ["Market skimming","Set a high initial price to capture revenue from less price-sensitive customers first, then lower it","Distinctive product, high willingness to pay at the top, limited early capacity"],
   ["Market penetration","Set a low initial price to win volume and market share fast","Price-sensitive buyers, scale economies, spare capacity, competitive threat"],
   ["Dynamic pricing","Vary price by time, demand, channel or customer data","Airlines, hotels, ride hailing, anything with perishable capacity"],
   ["Cost-plus","Add a fixed margin to unit cost","Simple, but ignores perceived value entirely"]]},
  {t:"callout", lab:"The clean contrast", v:"Skimming aims to maximise revenue from less price-sensitive customers. Penetration aims to maximise market share. That exact pairing is the tested phrasing."},
  {t:"h", v:"Two further ideas"},
  {t:"list", v:["Reference price danger: a low introductory price anchors the customer and makes later increases very hard.",
   "Pricing architecture: customers react very differently to a fixed monthly fee, an activation fee and usage charges even when total expected spend is similar. Structure is a positioning instrument, not just arithmetic."]}]},

{n:"16", id:"f16", title:"Place, channels, push and pull", sub:"Who stands between you and the buyer",
 blocks:[
  {t:"list", v:["Channels influence far more than logistics. They shape awareness, trust, recommendation, price, adoption and perceived risk.",
   "Intermediaries become powerful when customers lack technical knowledge, delegate the choice, or depend on expert installation.",
   "You can remove a layer, but not the functions it performed. Somebody still has to hold stock, educate the buyer and handle after-sale service.",
   "D2C can bypass an intermediary for purchase or demand generation, but bypassing fails when that intermediary controls installation, trust or access."]},
  {t:"cards", v:[
   ["Push","Influence intermediaries to stock, recommend and sell. Trade promotions, margins, sales force effort."],
   ["Pull","Build end-customer demand strong enough that the product is pulled through the channel. Advertising, brand building, demonstration."]]},
  {t:"p", v:"Which to use depends on who actually controls the decision, how informed the customer is, how much channel power exists, and how complex the product is."}]},

{n:"17", id:"f17", title:"Promotion and communication", sub:"Six planning questions and the inbound split",
 tested:["2025 Q2","2021 Q15","2021 Q18"],
 blocks:[
  {t:"table", head:["The 6 Ms","Question"], rows:[
   ["Market","To whom is the communication addressed?"],
   ["Mission","What is the objective?"],
   ["Message","What specific points must be communicated?"],
   ["Media","Which vehicles carry it?"],
   ["Money","How much will be spent?"],
   ["Measurement","How will impact be assessed afterwards?"]]},
  {t:"cards", v:[
   ["Outbound","Interrupting the customer. Advertisements, cold calls, mass mailers. Reach is bought."],
   ["Inbound","Creating and sharing valuable content that attracts and engages customers, so they come to you. Its characteristic weak point is converting attention into the final sale."],
   ["Advertising","Best at awareness, describing features, suggesting usage, distinguishing from rivals, building image. Poor at closing."],
   ["Sales promotion","Short-term inducement to act. Samples, coupons, contests. Complements advertising, does not replace it."],
   ["Public relations","Non-paid communication such as press coverage and speeches. Cheap and credible, but far less controllable."],
   ["Personal selling","Two-way, tailored. Importance rises with product complexity and the need to educate the buyer."]]},
  {t:"callout", lab:"Demonstration media", v:"When a product's benefit has to be seen to be understood, choose a demonstrating medium such as video, a live display or a working unit in store. This is a recurring answer."}]},

{n:"18", id:"f18", title:"B2B buying and the buying centre", sub:"The customer is rarely one person",
 tested:["2025 Q3","2025 Q8","2025 Q18","2025 Q31"],
 blocks:[
  {t:"table", head:["Role","What they do","How the question describes them"], rows:[
   ["Initiator","Recognises the need and starts the process","Raises the requirement, first flags the problem"],
   ["User","Actually uses the product","Reports satisfaction, complains about usability, is affected daily"],
   ["Influencer","Shapes specifications or evaluation criteria","Advises, evaluates, sets technical requirements"],
   ["Decider","Has authority over the final choice","Makes the call, approves"],
   ["Buyer","Handles commercial terms and the purchase process","Compares suppliers and prices, negotiates, places the order"],
   ["Gatekeeper","Controls access and the flow of information","Manages initial contact, screens vendors, routes information"]]},
  {t:"callout", lab:"Exam pattern", v:"An executive assistant who manages the initial contact and information flow is a gatekeeper, not a buyer. A physician who must be educated before a drug reaches the patient is a gatekeeper. Surgeons who report satisfaction with a brand after purchase are users, even though they influence the next decision."},
  {t:"h", v:"Buying situations"},
  {t:"table", head:["Situation","Risk and effort"], rows:[
   ["New task","Highest perceived risk, largest buying centre, most information needed"],
   ["Modified rebuy","Some change to specification, price or supplier. Moderate"],
   ["Straight rebuy","Routine reorder, often automatic, hardest for a new supplier to break into"]]},
  {t:"h", v:"Centralised and decentralised purchasing"},
  {t:"table", head:["Model","Gains","Loses"], rows:[
   ["Centralised","Greater purchasing power, volume discounts, consistent terms, fewer suppliers to manage","Responsiveness to local needs, subsidiary autonomy"],
   ["Decentralised","Local responsiveness and speed, autonomy for local managers","Volume leverage, consistency, negotiating power"]]},
  {t:"h", v:"Two ideas that keep returning"},
  {t:"list", v:["Moment of truth: every interaction with any stakeholder moves their perceived value up or down. Accounts departments and switchboards are part of marketing.",
   "Hygiene factor: something you cannot trade away or compensate for. On-time delivery and ease of use buy you a seat, they do not win the deal. In decision-rule terms this behaves like a conjunctive rule."]}]},

{n:"19", id:"f19", title:"Market sizing and the marketing plan", sub:"From analysis to a budget",
 tested:["2021 Q8"],
 blocks:[
  {t:"flow", v:[
   ["TAM","Total addressable market","Broad theoretical demand for the category"],
   ["SAM","Serviceable addressable market","What you can serve given geography, logistics, scope and capability"],
   ["SOM","Serviceable obtainable market","What you can realistically win after competition and execution"]]},
  {t:"p", v:"PAM, the potential addressable market, sits outside all three. It is a new or uncharted application not reflected in current estimates. The gap from TAM to SAM is your own capability and structural limits. The gap from SAM to SOM is competition."},
  {t:"table", head:["Approach","How it works"], rows:[
   ["Top-down","Total market demand, then narrow by geography and capability, then apply a realistic obtainable share"],
   ["Bottom-up","Number of customers, times units per customer, times purchase frequency, aggregated account by account"]]},
  {t:"callout", lab:"The honest part", v:"There is no single correct number. Sources will disagree and will not reconcile. Defend your assumptions rather than your answer, and trust a source based on its track record against actuals. An estimate above capacity is a capital expenditure proposal and needs a multi-year return argument."},
  {t:"p", v:"A marketing plan translates all of this into decisions about whom to serve, how much demand to plan for, what to produce, how to allocate resources, and how to set product, price, place and promotion. It contains all of those, which is why a question offering only one of them as an answer is testing whether you pick none of the above."}]},

{n:"20", id:"f20", title:"Marketing research", sub:"Seeing what consumers cannot easily say",
 tested:["2021 Q2"],
 blocks:[
  {t:"table", head:["Method","What it does","When to use it"], rows:[
   ["Scientific observation","Systematically records behaviour, objects and interactions without questioning anyone","Behaviour is habitual, subconscious or hard to verbalise"],
   ["Ethnography","Immersion in the consumer's natural environment to understand context, rituals and meaning","You need the culture around the behaviour, not just the behaviour"],
   ["Mystery shopping","Researcher behaves as a normal customer","Evaluating service delivery and process"],
   ["Eye tracking","Records gaze path, order and exit point","You need what was actually noticed, not what people claim to have noticed"],
   ["Focus group","Moderated group discussion","Capturing group reactions to a concept, positioning or idea"],
   ["Depth interview and laddering","One-to-one probing from attribute to underlying value","Discovering motives before you can write a questionnaire"],
   ["Projective techniques","Word association, personification, metaphors","Meanings consumers cannot state directly"],
   ["Survey","Structured measurement at scale","Quantifying something you have already discovered"],
   ["Conjoint","Trade-offs among whole bundles","Valuing attributes and estimating willingness to pay"],
   ["Cluster analysis","Groups respondents by similarity","Turning measured needs into segments"]]},
  {t:"callout", lab:"Order matters", v:"Qualitative discovers, quantitative measures, clustering groups, demographics describe. Behaviour and practices are observable. Perceptions, attitudes, beliefs, values and ideology are not, so they must be inferred or probed. Cameras need consent, an existing store CCTV is acceptable, hidden cameras are not."},
  {t:"p", v:"The alien mindset: behave as though you know nothing about the category. If people believe you already know, they compress the explanation, and the detail they skip is where the insight was."}]},

{n:"21", id:"f21", title:"Measuring value and decision rules", sub:"How buyers combine attributes",
 blocks:[
  {t:"table", head:["Rule","How the buyer decides","Marketing implication"], rows:[
   ["Compensatory","Strength on one attribute offsets weakness on another. Score is the sum of importance weight times performance","You can win despite a weakness, if you are strong enough elsewhere"],
   ["Conjunctive","Every important attribute must clear a minimum threshold","One failure eliminates you. This is a hygiene factor in arithmetic"],
   ["Disjunctive","Acceptable if it excels on at least one key attribute","A single outstanding feature can carry the sale"],
   ["Lexicographic","Pick the best on the single most important attribute and ignore the rest","Find out what that one attribute is"],
   ["Affect referral","Skip evaluation, use stored overall liking","Brand equity does the work"],
   ["Recognition heuristic","Choose the familiar option","Awareness alone can win low-involvement choices"],
   ["Popularity heuristic","Use cues like most downloads or most reviews","Social proof is a purchasable asset"]]},
  {t:"h", v:"Measuring attribute importance"},
  {t:"table", head:["Method","Strength and weakness"], rows:[
   ["Direct rating","Fast, but respondents call everything important"],
   ["Ranking","Forces an order, but gives no sense of distance between ranks"],
   ["Constant sum","Allocate a fixed pool of points, which forces a real trade-off"],
   ["Inferred from choice","Strongest. Infers importance from choices among whole bundles, which is conjoint"]]},
  {t:"p", v:"Regression intuition: Y equals mX plus c estimates the presence, strength and direction of a relationship. In marketing Y may be purchase likelihood and X an attribute level. Multiple regression handles many attributes at once, which is the machinery underneath conjoint."}]},

{n:"22", id:"f22", title:"Conjoint analysis", sub:"Pricing a feature without asking about it",
 tested:["2025 Q29","2025 Q30","2021 Q14","2021 Q19"],
 blocks:[
  {t:"p", v:"Respondents evaluate complete product bundles rather than rating features one at a time. Their preferences are then decomposed into the utility contributed by each attribute level."},
  {t:"table", head:["Term","Meaning","Example"], rows:[
   ["Attribute","The dimension being varied","Price, packaging, storage, brand, warranty"],
   ["Level","A specific value of that attribute","60 rupees, glass, 64 GB, three years"],
   ["Profile","One complete bundle of levels shown to a respondent","Glass packaging at 80 rupees"],
   ["Part-worth","The utility contribution of one level","Glass contributes 1.4 utils for Segment X"],
   ["Total utility","The sum of the part-worths of the selected levels",""]]},
  {t:"h", v:"Reading a part-worth table"},
  {t:"table", head:["Attribute","Level","Segment X","Segment Y"], rows:[
   ["Price","60","2.5","1.5"],["Price","80","1.0","1.0"],["Price","100","&minus;2.0","&minus;1.5"],
   ["Packaging","Glass","1.4","0.5"],["Packaging","Refill pouch","&minus;1.4","1.0"]]},
  {t:"list", v:["Price sensitivity is the spread of the price part-worths. Segment X swings from 2.5 to minus 2.0, a range of 4.5. Segment Y swings from 1.5 to minus 1.5, a range of 3.0. So Segment X is the more price-sensitive of the two.",
   "The right level for a segment is simply its highest part-worth on that attribute. Segment X prefers glass at 1.4 against minus 1.4. Segment Y prefers the refill pouch at 1.0 against 0.5.",
   "Relative importance of an attribute is its part-worth range divided by the sum of all attribute ranges.",
   "Willingness to pay is read by comparing the utility gained from a feature against the utility lost to a higher price."]},
  {t:"callout", lab:"Limitations to state whenever you cite conjoint", v:"Too many attributes makes the task complex and unreliable, and too many levels demands more data. Unrealistic combinations damage validity. Omitting a variable such as brand distorts results. Sample composition matters, fatigue reduces reliability, and hypothetical choices are not real purchases. Include a none option if you want to estimate primary demand."},
  {t:"callout", lab:"The trap", cls:"warn", v:"Conjoint does not segment respondents using demographic variables. It estimates utilities. Clustering on those utilities is what creates segments, and demographics are then used to profile them."}]},

{n:"23", id:"f23", title:"Cluster analysis", sub:"Turning measured needs into segments",
 tested:["2025 Q1","2025 Q33"],
 blocks:[
  {t:"p", v:"Cluster analysis groups observations so that members inside a cluster are very similar to each other, while clusters differ significantly from one another. That is the statistical version of a good segment. Clusters do not have to be the same size."},
  {t:"h", v:"K-means, step by step"},
  {t:"flow", v:[["1","Choose K","Decide how many clusters to look for"],
   ["2","Initialise","Place K starting centroids"],
   ["3","Assign","Send each observation to its nearest centroid"],
   ["4","Recalculate","Move each centroid to the mean of its members"],
   ["5","Repeat","Until membership stops changing"]]},
  {t:"p", v:"The objective is to minimise within-cluster distance. The outputs are the centroids, which you read to name and interpret each segment, and cluster membership for each respondent."},
  {t:"callout", lab:"Which technique, which job", v:"Clustering finds distinct groups of consumers, such as Performance Enthusiasts against Status Seekers. Conjoint values attributes. Correlation measures association between two variables. Regression predicts an outcome. ANOVA compares group means. A question asking how to identify distinct groups in a mixed dataset is always clustering."}]},

{n:"24", id:"f24", title:"Competitive advantage", sub:"Winning, and then keeping it",
 tested:["2025 Q9","2025 Q28","2025 Q32","2021 Q20"],
 blocks:[
  {t:"p", v:"Two basic routes. Lower delivered cost, or higher perceived benefit. Either can be applied broadly or to a narrow niche."},
  {t:"matrix", cols:["Low cost","Differentiation"], rows:[
   ["Broad market",["Cost leadership","Win on price and scale. The strategy most likely to trigger a price war"],
    ["Differentiation","Win on distinctive perceived benefit"]],
   ["Narrow niche",["Cost focus","Lowest cost inside one segment"],
    ["Differentiation focus","Distinctive value inside one segment. The answer when a small local player faces a giant"]]]},
  {t:"callout", lab:"Two tested points", v:"A cost leadership strategy is the one most likely to induce a price war, because competing on price invites retaliation on price. And a small artisan player facing a global chain should compete on differentiation, never on cost, because it cannot win a scale fight."},
  {t:"h", v:"Ansoff growth matrix"},
  {t:"matrix", cols:["Existing products","New products"], rows:[
   ["Existing markets",["Market penetration","Sell more of the same to the same people"],
    ["Product development","New products to your current customers"]],
   ["New markets",["Market development","Existing products into new geographies or segments"],
    ["Diversification","Both new. Highest risk"]]]},
  {t:"h", v:"Sustaining it"},
  {t:"cards", v:[
   ["Blue ocean","Create a new competitive space by redefining the category, instead of fighting in a crowded red ocean."],
   ["VRIO","Advantage lasts when a capability is Valuable, Rare, hard to Imitate, and the firm is Organised to capture the value."],
   ["Value chain","Primary: inbound logistics, operations, outbound logistics, marketing and sales, service. Support: infrastructure, HR, technology, procurement."],
   ["System advantage","A chain of reinforcing activities is far harder to copy than one visible feature. Advantage comes from the fit among activities."],
   ["Stuck in the middle","No cost advantage, no meaningful differentiation and no focused segment. Though a focused system can genuinely combine both."],
   ["Asset productivity","Sales per square foot and return on assets can reveal productivity better than margin alone."]]},
  {t:"h", v:"Escaping commoditisation"},
  {t:"p", v:"A commodity competes on price, availability and specification, which collapses margin. The escape is to convince target consumers that your product is different from competitors, and to build that difference out of service, reliability, packaging, customisation, delivery, quality assurance and contract structure. Convincing them you are merely as good as everyone else is not differentiation."}]}
];

   PRACTICE BANK. p = past paper origin, absent = written for coverage.
   d = optional data block rendered above the options.
