const CASES = [{"num": 1, "title": "NTT DoCoMo: i-mode", "body": "<p>DoCoMo’s mobile network was facing heavy voice traffic, and packet-based mobile data offered a way to create a new source of usage. The problem was that the early product was objectively limited: handsets were basic, screens were small, data speed was weak and the user experience was far from a desktop Internet connection.</p><p>The strategic breakthrough was not a technical breakthrough alone. The team deliberately considered who could still receive strong value from the imperfect technology. Business users looked economically attractive but had very demanding functional expectations. Younger users valued communication, entertainment, novelty and self-expression and were more tolerant of technical limitations.</p><p>The resulting proposition combined low impulse-style pricing with constantly refreshed content such as ringtones, wallpapers and entertainment. Promotion avoided technical intimidation. The service was framed as friendly, easy and socially useful rather than as sophisticated Internet infrastructure.</p><p>The collaborator model was equally important. Third-party content providers gained access to users and billing while familiar HTML reduced their technical adoption cost. This created a win-win-win structure among DoCoMo, users and content creators.</p><div class=\"callout\"><b>Main learning:</b> customer value and product-market fit can matter more than raw technology. Segment expectations, collaborators, positioning and the 4Ps must fit the actual performance of the offering.</div>"}, {"num": 2, "title": "A-One Starch Products", "body": "<p>A-One Starch is a B2B case about planning production and marketing for liquid glucose in a category with commodity characteristics. The immediate managerial question is deceptively simple: how much should the company plan to produce next year?</p><p>The class used the case to show that demand forecasting is not a hunt for one correct number. Different exhibits, historical shares and customer signals need judgment. A top-down approach starts from total market demand and narrows to serviceable demand and attainable share. A bottom-up approach starts with current customers, account volumes, frequency and expected growth.</p><p>TAM, SAM and SOM became the central language. Geography, transport cost, delivery requirements and company capability can remove demand from TAM to produce SAM. Competition and realistically achievable share then reduce SAM to SOM. PAM was introduced for new applications or new industries outside the currently mapped demand.</p><p>The case also introduced B2B segmentation and the commodity trap. If the physical product is hard to differentiate, the company can differentiate through service reliability, packaging, relationships, delivery and contracts. Customer concentration also raised the question of whether too many low-value accounts can degrade service for more profitable customers.</p><div class=\"callout\"><b>Main learning:</b> market sizing, segment selection and service differentiation are strategic decisions, not mechanical calculations.</div>"}, {"num": 3, "title": "Kimura K.K.: Can This Customer Be Saved?", "body": "<p>Pramtex is proud of Spartacus, a sophisticated optical-disk production system positioned internally as premium and technologically superior. The company’s engineering culture sees the product almost as the “Ferrari” of the category. Yet an important customer does not simply reward that superiority with repeat orders.</p><p>The case shows why high-stakes B2B buying cannot be understood as one customer with one objective. Different members of Kimura’s buying centre have different incentives. Technical experts may admire advanced engineering; production teams care about uptime and maintainability; finance worries about cost and risk; senior leaders care about trust and long-term relationship quality.</p><p>The class emphasized that a price cut is not automatically a solution. If the core problem is serviceability, operational complexity, risk or relationship damage, lower price does not repair the value proposition.</p><p>The discussion also brought in cultural and relationship handling. Focusing too heavily on one technical champion while neglecting the wider organization can be disastrous in a complex buying centre.</p><div class=\"callout\"><b>Main learning:</b> B2B marketing requires stakeholder-specific value creation. Technical superiority is only one component of perceived value.</div>"}, {"num": 4, "title": "Aqualisa Quartz: Simply a Better Shower", "body": "<p>Quartz appears to be a dream innovation. It solves several old shower problems at once: easier installation, reduced wall work, stable temperature, better pressure, push-button control and an attractive interface. Consumer trials were extremely positive.</p><p>The puzzle is therefore not product quality but adoption. The class calculation compared the customer’s total installed cost of a conventional mixer/pump solution with Quartz. When pump cost and two days of plumber labour were included, the conventional solution could cost roughly £2,175 versus about £1,320 for Quartz in the simplified class calculation. Quartz’s high unit price did not necessarily mean high total cost.</p><p>The central barrier was the channel. Plumbers strongly influenced brand and product choice, and many distrusted unfamiliar electronics. Yet the case also showed that once a plumber actually installed Quartz, the ease of installation could turn skepticism into advocacy.</p><p>This created a strategy problem. Direct consumer marketing could build pull but might bypass the very people who controlled installation. Developers offered volume but long cycles and price sensitivity. DIY channels offered reach but risked premium-brand dilution. Focusing only on premium users could keep the product niche.</p><p>The class therefore discussed a combination of consumer education and channel seeding: create pull among end users while reducing plumber risk through demonstration and trial. The case also raised cannibalization: should Aqualisa protect its existing core line or accept that the new architecture may replace it?</p><div class=\"callout\"><b>Main learning:</b> breakthrough products fail when the adoption system is not redesigned along with the product.</div>"}, {"num": 5, "title": "Trader Joe’s", "body": "<p>Trader Joe’s is a retail strategy case built around an unusual combination: low prices, narrow assortment, private labels, quirky discovery and exceptionally strong customer loyalty. Stores are small, assortment is far narrower than conventional supermarkets and many products are exclusive private-label items.</p><p>The target segment is psychographic rather than merely demographic. The customer is curious, educated, health conscious, well travelled, willing to experiment and strongly value conscious. The class repeatedly stressed that &#x27;educated&#x27; alone is not the segment; lifestyle, taste and cultural identity explain the fit.</p><p>The class first examined competitive advantage through metrics. Profit margin alone can mislead. Trader Joe’s generated extraordinary sales per square foot, which points to efficient use of assets and operating design.</p><p>A major debate was whether Trader Joe’s was a cost leader or differentiator. It had genuinely low prices and lean operations, but it also offered a differentiated assortment, treasure-hunt experience, culture and human service. The resolution was a focused strategy: by serving a narrow lifestyle segment, the company could combine cost discipline and distinctive value.</p><p>The sustainable advantage lies in the activity system: small stores, limited SKUs, direct/private-label sourcing, supplier secrecy, employee culture, low in-store technology, distinctive product curation and a cult-like customer community reinforce one another. A rival can copy one visible feature without reproducing the whole system.</p><div class=\"callout\"><b>Main learning:</b> sustainable advantage comes from a coherent system designed for a sharply defined segment.</div>"}, {"num": 6, "title": "Apple vs Samsung: The $2 Billion Case", "body": "<p>The case asks how much consumers value specific smartphone/tablet features in a legal dispute. A direct question such as &#x27;How much is this feature worth?&#x27; is unreliable because people tend to overstate the importance of many features.</p><p>Conjoint analysis solves the problem by forcing consumers to make trade-offs among whole product profiles. The study varied attributes such as camera, size and weight, touchscreen behaviour, storage, connectivity, number of apps and price.</p><p>Respondents completed multiple choice tasks. Statistical estimation then produced part-worth utilities for the individual levels. The total utility of a product is the sum of the part-worths of its included levels.</p><p>Price becomes especially useful because utility changes caused by a feature can be compared with utility changes caused by price, producing a willingness-to-pay estimate.</p><p>The class also examined limitations: sampling only certain users, omitted brand effects, hypothetical choices, task complexity and the absence/presence of a &#x27;none&#x27; option. A none option matters because it can help estimate whether consumers want anything in the choice set at all.</p><div class=\"callout\"><b>Main learning:</b> conjoint is powerful because it observes trade-offs, but the result is only as good as the sample, attributes, levels and experimental design.</div>"}, {"num": 7, "title": "Omnitel Pronto Italia", "body": "<p>Omnitel is a new entrant facing incumbent TIM in a mobile market with low overall penetration. A major psychological barrier is the monthly fee, which consumers perceive almost like a fixed tax before they even make a call.</p><p>The proposed LIBERO-style architecture removes the monthly fee and shifts more of the charge toward actual usage. The strategic issue is whether this can grow the category without being interpreted as a simple price cut that triggers a destructive response from TIM.</p><p>Omnitel’s research combines conjoint analysis and cluster analysis. Conjoint estimates how much individuals care about brand, activation cost, monthly charge, peak/off-peak tariffs, special tariffs and service. Cluster analysis then groups similar value systems into segments such as cost sensitive, service sensitive, special-tariff oriented and brand loyal.</p><p>The same logic is applied to current users, prospects and rejecters. The class argued that prospects can be especially attractive because they are already near adoption but are not yet locked into the incumbent. Rejecters may have a deeper category barrier, while current users may face switching resistance.</p><p>Demographics are then used to profile and reach the value segments, not necessarily to define them. This distinction between segmentation variables and profiling variables was a major statistical/marketing lesson.</p><p>The positioning problem is as important as the pricing problem. &#x27;Cheaper than TIM&#x27; invites direct comparison and retaliation. A stronger message reframes mobile service around freedom, fairness or pay-for-use and changes the meaning of the category.</p><div class=\"callout\"><b>Main learning:</b> pricing structure can be part of positioning, and psychographic/value segmentation can be built quantitatively from conjoint utilities.</div>"}, {"num": 8, "title": "Evoe Spring Spa: A Positioning Dilemma", "body": "<p>Evoe is preparing to launch in a nascent Indian spa/wellness market. The founders deliberately research both current spa users and non-users because the opportunity is not merely to steal share but to expand the category.</p><p>Possible segmentation bases include usage frequency, profession, benefit sought, age, gender and geography. The research surfaces multiple category associations and barriers: relaxation, indulgence, femininity, expense, stigma, health, rejuvenation and vacation.</p><p>The competitive frame is broader than &#x27;other spas&#x27;. Gyms, clubs, resorts, salons, medical/wellness providers and traditional health systems can all compete for the underlying need.</p><p>The positioning process turns qualitative consumer values into three candidate concepts: <b>Affordable Indulgence</b>, <b>Affordable Health</b> and <b>A Little Vacation</b>. The team then creates concept boards and tests resonance across consumer groups such as Snails, Climbers, Racers and Sprinters.</p><p>The final choice cannot rely only on the highest test score. It should also consider motivation to try, repeat potential, communication across touchpoints, differentiation, long-term equity and reason-to-believe.</p><p>A particularly important classroom idea was category reframing. Positioning a spa around health rather than luxury/indulgence can increase legitimacy and reduce guilt or stigma. That changes the category’s mental model, not just the brand’s location within it.</p><div class=\"callout\"><b>Main learning:</b> positioning is a research-driven choice of mental space that must be relevant, differentiated, credible and executable.</div>"}, {"num": 9, "title": "Mahindra Scorpio: Brand Positioning", "body": "<p>Scorpio extends the positioning discussion from service brands to automobiles. The class begins by asking what the true competitive set is. A customer spending within a given budget may compare a utility vehicle with sedans or other SUVs, even if the engineering categories differ.</p><p>The exercise uses perceptual axes such as luxury/affordable, urban/off-road, family/adventure, comfort/power, compact/king-size, youthful/traditional and rugged/sophisticated. The purpose is not to find a mechanically &#x27;best&#x27; quadrant but to see how brands occupy mental spaces.</p><p>The deeper discussion moves from functional positioning to identity positioning. Vehicle choice can symbolize masculinity and self-concept. One pole represents the responsible conformist/breadwinner; another represents the adventurous rebel.</p><p>The opportunity is to create a position that resolves the tension rather than choosing one side. A vehicle can be responsible enough for family/social legitimacy while still expressing power, ruggedness and adventure.</p><div class=\"callout\"><b>Main learning:</b> powerful positioning often operates at the level of identity and cultural meaning, not only features.</div>"}];
let activeCase = 0;

function renderCaseTOC(){
  const toc=document.getElementById('minitoc');
  toc.className='minitoc case-toc';
  toc.innerHTML='<b>Cases</b>'+CASES.map((c,i)=>
    '<a href="#" data-case="'+i+'" class="'+(i===activeCase?'active':'')+'">'+
    '<span class="case-no">Case '+String(c.num).padStart(2,'0')+'</span>'+c.title+'</a>'
  ).join('');
  toc.querySelectorAll('[data-case]').forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault();
    activeCase=+a.dataset.case;
    renderActiveCase();
    renderCaseTOC();
    window.scrollTo({top:0,behavior:'smooth'});
  }));
}

function renderActiveCase(){
  const host=document.getElementById('case-host');
  if(!host) return;
  const c=CASES[activeCase];
  host.innerHTML=
    '<div class="case-switcher">'+
      '<span class="case-count">Case '+String(c.num).padStart(2,'0')+' of '+CASES.length+'</span>'+
      '<div class="case-nav-buttons">'+
        '<button class="btn" id="case-prev" '+(activeCase===0?'disabled':'')+'>Previous</button>'+
        '<button class="btn" id="case-next" '+(activeCase===CASES.length-1?'disabled':'')+'>Next</button>'+
      '</div>'+
    '</div>'+
    '<article class="case-detail">'+
      '<span class="kicker">Case '+c.num+'</span>'+
      '<h3>'+c.title+'</h3>'+
      c.body+
    '</article>';

  const prev=document.getElementById('case-prev');
  const next=document.getElementById('case-next');
  if(prev) prev.addEventListener('click',()=>{ if(activeCase>0){activeCase--;renderActiveCase();renderCaseTOC();} });
  if(next) next.addEventListener('click',()=>{ if(activeCase<CASES.length-1){activeCase++;renderActiveCase();renderCaseTOC();} });
}

function renderKit(){
  const el=document.getElementById('panel-kit');
  el.innerHTML=`<div class="case-reader"><div id="case-host"></div></div>`;
  renderActiveCase();
}

/* ---------------- quiz engine ---------------- */
const progress={};
let storageOK=true;
async function loadProgress(){
  try{ const r=await window.storage.get('mkt1:practice');
    if(r && r.value) Object.assign(progress, JSON.parse(r.value)); }catch(e){}
}
async function saveProgress(){
  if(!storageOK) return;
  try{ await window.storage.set('mkt1:practice', JSON.stringify(progress)); }catch(e){ storageOK=false; }
}

function buildQuiz(){
  const el=document.getElementById('panel-drill');
  const bank=QS;
  const topics=[...new Set(bank.map(q=>q.t))].sort();
  let h='<h2 class="page">Practice</h2>';
  h+='<div class="quizbar"><div class="meter">'+
     '<div class="meterbar"><div class="meterfill" id="q-fill"></div></div>'+
     '<span class="meterlab" id="q-lab">0 of '+bank.length+' answered</span></div>'+
     '<div><button class="btn" id="q-shuffle">Shuffle</button> '+
     '<button class="btn" id="q-reset">Reset</button></div></div>';
  h+='<div class="chips" id="q-chips">'+
     '<button class="chip" data-f="all" aria-pressed="true">All '+bank.length+'</button>'+
     '<button class="chip paper" data-f="paper:2025">2025 paper</button>'+
     '<button class="chip paper" data-f="paper:2021">2021 paper</button>'+
     '<button class="chip paper" data-f="paper:none">Extra coverage</button>'+
     topics.map(t=>'<button class="chip" data-f="t:'+t+'">'+t+'</button>').join('')+
     '</div><div id="q-list"></div>';
  el.innerHTML=h;

  let order=bank.map((_,i)=>i);
  let filter='all';

  function match(q){
    if(filter==='all') return true;
    if(filter==='paper:2025') return q.p && q.p.indexOf('2025')===0;
    if(filter==='paper:2021') return q.p && q.p.indexOf('2021')===0;
    if(filter==='paper:none') return !q.p;
    if(filter.indexOf('t:')===0) return q.t===filter.slice(2);
    return true;
  }
  function meter(){
    const keys=Object.keys(progress);
    const right=keys.filter(k=>progress[k]).length;
    const pct=Math.round(keys.length/bank.length*100);
    document.getElementById('q-fill').style.width=pct+'%';
    document.getElementById('q-lab').textContent=keys.length+' of '+bank.length+' answered'+
      (keys.length?'  \u00b7  '+right+' correct':'');
  }
  function draw(){
    const list=document.getElementById('q-list');
    let out='',shown=0;
    order.forEach(i=>{
      const q=bank[i];
      if(!match(q)) return;
      shown++;
      const key='q:'+i, answered=key in progress;
      out+='<div class="q" data-i="'+i+'"><div class="qtop"><span><span class="qtag">'+q.t+'</span>'+
           (q.p?'<span class="qsrc">'+q.p+'</span>':'')+'</span><span class="qnum">'+
           (answered?(progress[key]?'<span class="doneflag">correct</span>':'attempted'):String(shown).padStart(2,'0'))+
           '</span></div>';
      out+='<p class="qprompt">'+q.q+'</p>';
      if(q.d) out+='<div class="qdata">'+tableHTML(q.d.head,q.d.rows)+'</div>';
      out+='<div class="opts">';
      q.o.forEach((opt,j)=>{
        out+='<button class="opt" data-q="'+i+'" data-o="'+j+'"><span class="mark">'+
             String.fromCharCode(65+j)+'</span><span>'+opt+'</span></button>';
      });
      out+='</div><div class="whyslot"></div></div>';
    });
    if(!shown) out='<p>No questions under that filter.</p>';
    list.innerHTML=out;
    list.querySelectorAll('.opt').forEach(b=>{
      b.addEventListener('click',()=>{
        const card=b.closest('.q');
        if(card.dataset.locked) return;
        card.dataset.locked='1';
        const qi=+b.dataset.q, oi=+b.dataset.o, q=bank[qi];
        card.querySelectorAll('.opt').forEach((o,idx)=>{
          o.disabled=true;
          if(idx===q.a) o.classList.add('correct');
          if(idx===oi && oi!==q.a) o.classList.add('wrong');
        });
        card.querySelector('.whyslot').innerHTML='<div class="why"><b>'+
          (oi===q.a?'Correct':'Not quite')+'</b><p>'+q.e+'</p></div>';
        progress['q:'+qi]=(oi===q.a);
        saveProgress(); meter();
      });
    });
    meter();
  }
  document.getElementById('q-shuffle').addEventListener('click',()=>{
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
      const t=order[i]; order[i]=order[j]; order[j]=t; }
    draw();
  });
  document.getElementById('q-reset').addEventListener('click',()=>{
    Object.keys(progress).forEach(k=>delete progress[k]);
    saveProgress(); order=bank.map((_,i)=>i); draw();
  });
  document.getElementById('q-chips').addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    filter=c.dataset.f;
    document.querySelectorAll('#q-chips .chip').forEach(x=>
      x.setAttribute('aria-pressed', String(x===c)));
    draw();
  });
  draw();
}



const READINGS = [{"id": "r1", "ch": "Ch. 1", "title": "Defining Marketing for the New Realities", "priority": "high", "diagram": "orientation", "summary": "Marketing is not simply selling or advertising. It is the process of choosing customers, understanding what they value, and creating, communicating and delivering an offering that creates superior value.", "concepts": [["Needs, Wants, Demand", "A need is a basic human requirement. A want is the form that need takes after culture, personality and available alternatives shape it. Demand exists when a want is backed by willingness and ability to pay."], ["Five management orientations", "Production focuses on availability and low cost; Product focuses on superior features; Selling focuses on persuasion and push; Marketing starts with target-customer needs; Market-Value thinking adds the value created for customers, company and collaborators."], ["New marketing realities", "Four forces reshape markets: technology, globalization, the physical environment, and social responsibility. They alter customer power, firm capabilities and competitive boundaries."], ["Holistic marketing", "Marketing must be coordinated across the whole organization. Its four components are relationship marketing, integrated marketing, internal marketing and performance marketing."]], "example": "If buyers want an easier way to commute, a marketing-oriented firm starts with that need and then designs the product, service, price and channel. A product-oriented firm may instead begin by building the technically 'best' vehicle and hope customers want it.", "exam": "Be able to distinguish Production vs Product vs Selling vs Marketing from short situations. Also remember that a want is not automatically demand."}, {"id": "r2", "ch": "Ch. 2", "title": "Marketing Planning and Management", "priority": "high", "diagram": "gstic", "summary": "Marketing planning links analysis to action. First understand the market, then choose where and how to create value, translate that choice into tactics, execute it and measure the result.", "concepts": [["Five Cs", "Customers: whose needs matter? Company: what can we do well? Competitors: who else serves the same need? Collaborators: who helps us create/deliver value? Context: what external forces shape the game?"], ["G-STIC", "Goal sets the outcome; Strategy defines the target market and value proposition; Tactics specify the market offering; Implementation turns the plan into reality; Control measures progress and environmental change."], ["Strategy vs tactics", "Strategy answers 'where will we play and what value will we create?' Tactics answer 'what exactly will we offer and how will the market experience it?'"], ["Seven tactics", "Product, service, brand, price, incentives, communication and distribution work together. They should reinforce the same value proposition."]], "example": "A company may target time-poor urban professionals with 'healthy food without cooking'. Its tactics then need to make that promise real through menu design, delivery speed, pricing, packaging and communication.", "exam": "A common trap is treating a tactic such as 'lower the price' as the strategy itself. Strategy is the target market plus value proposition."}, {"id": "r3", "ch": "Ch. 3", "title": "Analyzing Consumer Markets", "priority": "high", "diagram": "consumer", "summary": "Consumer behaviour explains how people select, buy, use and evaluate offerings. Decisions are shaped by both observable influences and internal psychology.", "concepts": [["Influences on behaviour", "Cultural factors shape values and norms; social factors include family and reference groups; personal factors include age, income, occupation and lifestyle; psychological factors include motivation, perception, learning, memory and emotion."], ["Buying decision process", "Consumers usually move through problem recognition, information search, evaluation of alternatives, purchase and postpurchase evaluation. They may skip or compress stages for routine purchases."], ["Perceived risk", "Functional risk = product may not work; Physical = may cause harm; Financial = may waste money; Social = others may judge the choice; Psychological = choice may conflict with self-image; Time = the decision may waste time or create switching effort."], ["Satisfaction", "Satisfaction depends on perceived performance relative to expectations. Performance below expectations creates dissatisfaction; meeting or exceeding expectations creates satisfaction or delight."]], "example": "Someone may avoid switching software even when it is cheaper because of learning effort, lost shortcuts and uncertainty. Those non-monetary costs reduce perceived value.", "exam": "Risk-type questions are easy to confuse. Ask: 'What exactly might go wrong?' Bodily harm = physical; not performing = functional; embarrassment = social."}, {"id": "r4", "ch": "Ch. 4", "title": "Analyzing Business Markets", "priority": "high", "diagram": "buyingcenter", "summary": "B2B buying is usually more formal than consumer buying and involves several people with different objectives, information and power.", "concepts": [["Buying situations", "Straight rebuy is routine and low-risk. Modified rebuy changes some specifications or suppliers. New task involves high uncertainty, more information search and usually a larger buying centre."], ["Buying centre / DMU", "Initiator recognizes the need; User uses the offering; Influencer shapes specifications; Decider chooses; Buyer executes commercial purchase; Gatekeeper controls access and information."], ["Centralized procurement", "Centralization can aggregate demand, improve bargaining power and standardize specifications, but it may reduce responsiveness to local needs."], ["Relationship logic", "B2B value extends beyond product performance to service, reliability, trust, total cost and the quality of the buyer-supplier relationship."]], "example": "A hospital buying diagnostic equipment may involve doctors as users/influencers, procurement as buyer, finance as evaluator, and a senior administrator as decider.", "exam": "Do not assume the 'buyer' is the 'decider'. In B2B questions, identify what each person actually does."}, {"id": "r5", "ch": "Ch. 5", "title": "Conducting Marketing Research", "priority": "high", "diagram": "research", "summary": "Marketing research turns uncertainty into evidence. The most important step is framing the right decision problem before collecting data.", "concepts": [["Research process", "Define the problem → develop the research plan → collect information → analyze information → make the decision."], ["Qualitative methods", "Focus groups, depth interviews and observation help uncover language, motives, hidden needs and hypotheses. They are rich in insight but not designed to estimate population percentages precisely."], ["Cluster analysis", "Groups observations so members within a cluster are relatively similar and clusters are relatively different. It is useful for discovering segments."], ["Conjoint analysis", "Respondents make trade-offs among alternative profiles. The model estimates part-worth utilities for attribute levels, which can be used to infer importance, preference and price sensitivity."]], "example": "If customers repeatedly choose a ₹100 option only when premium packaging is present, conjoint can quantify how much utility that packaging adds and whether it offsets the price penalty.", "exam": "Cluster = grouping people. Conjoint = valuing attributes. Regression = estimating relationships. Do not interchange these techniques."}, {"id": "r6", "ch": "Ch. 6", "title": "Identifying Market Segments and Target Customers", "priority": "high", "diagram": "stp", "summary": "Segmentation recognizes that the market is heterogeneous. Targeting chooses which customers the firm should serve, and profiling makes the chosen segment actionable.", "concepts": [["Segmentation bases", "Demographic = who they are; Geographic = where they are; Behavioral = what they do; Psychographic = why they behave that way, including lifestyle, attitudes and personality."], ["Strategic targeting", "Selects the kind of customers the firm wants to serve. It considers target attractiveness and compatibility with the company’s resources, capabilities and value proposition."], ["Tactical targeting", "Identifies specific prospects within the strategic target and determines how to reach them efficiently."], ["Single vs multi-segment", "A firm can concentrate on one segment or serve several. Multi-segment targeting can increase reach but also raises complexity and the risk of blurred positioning."]], "example": "Competitive marathon runners are a behavioral segment because the group is defined by what they do. 'Health-conscious achievers' is closer to a psychographic description.", "exam": "A segment can be attractive but still be the wrong target if the firm lacks the capability or credibility to serve it."}, {"id": "r7", "ch": "Ch. 7", "title": "Crafting a Customer Value Proposition and Positioning", "priority": "high", "diagram": "position", "summary": "Positioning is the place an offering occupies in the customer’s mind relative to alternatives. Good positioning is relevant, distinctive and believable.", "concepts": [["Frame of reference", "Defines the market/category and the competitors against which customers compare the offering. Change the frame and the same product can be evaluated differently."], ["Points of parity (POPs)", "Associations or benefits the brand must possess to be considered a legitimate member of the chosen category."], ["Points of difference (PODs)", "Benefits customers strongly associate with the brand, value positively and believe competitors do not deliver equally well."], ["Reason to believe", "Evidence that makes the positioning credible, such as technology, expertise, proof, design, ingredients, distribution or service capability."], ["Perceptual maps", "Plot brands on dimensions customers use to evaluate alternatives. A white space can reveal an opportunity, but only if customers value it and the firm can deliver it."]], "example": "A café may choose 'premium work space' rather than simply 'coffee shop' as its frame of reference. That changes its competitive set, price expectations and relevant benefits.", "exam": "Do not choose a positioning just because a map quadrant is empty. Empty can also mean customers do not care about that combination."}, {"id": "r8", "ch": "Ch. 8", "title": "Designing and Managing Products", "priority": "high", "diagram": "productmix", "summary": "Product decisions involve more than one item. Managers design portfolios and product lines so the overall assortment serves different customer needs without becoming unnecessarily complex.", "concepts": [["Portfolio dimensions", "Width = number of product lines; Length = total number of items; Depth = number of variants within a line; Consistency = how closely related the lines are."], ["Line stretching", "Extends a product line beyond its present range: down-market, up-market or both ways."], ["Line filling", "Adds more items inside the existing range to cover gaps, use excess capacity or block competitors."], ["Packaging and labeling", "Packaging identifies, protects and communicates the product. Labels identify, describe and sometimes persuade."], ["Guarantees and warranties", "Reduce perceived risk and signal confidence in quality and service reliability."]], "example": "If a brand already sells ₹40k–₹70k phones and adds a ₹30k model, that is a down-market stretch. Adding a ₹55k variant is line filling.", "exam": "Width, length and depth are frequent definition traps. Think: Width = lines; Length = total items; Depth = variants."}, {"id": "r10", "ch": "Ch. 10", "title": "Building Strong Brands", "priority": "med", "diagram": "brand", "summary": "A brand adds meaning beyond the physical product. It can influence what customers notice, expect, feel and are willing to pay.", "concepts": [["Brand equity vs brand power", "Brand equity captures the economic value associated with owning the brand; brand power reflects how brand knowledge changes consumer thinking, feeling and behaviour."], ["Brand elements", "Names, logos, symbols, slogans and packaging should ideally be memorable, meaningful, likable, transferable, adaptable and protectable."], ["Secondary associations", "Meaning can transfer from a company, country, channel, celebrity, event, ingredient or another brand."], ["Brand hierarchy", "House of brands keeps product brands distinct; branded house uses a strong master brand; sub-branding combines both."], ["Repositioning vs extension", "Repositioning changes the meaning of an existing brand. Extension uses an established brand to enter another category or price tier."]], "example": "A technology company using the same master name across laptop, phone and watch follows a branded-house logic; a company using unrelated names for each category is closer to a house of brands.", "exam": "Brand extension is about where the brand is used. Repositioning is about what the brand means."}, {"id": "r11", "ch": "Ch. 11", "title": "Managing Pricing and Sales Promotions", "priority": "high", "diagram": "pricing", "summary": "Price captures part of the value created for customers. Good pricing balances customer willingness to pay, demand, cost, competitive reactions and strategic objectives.", "concepts": [["Market skimming", "Starts high to capture value from less price-sensitive buyers. It works best when differentiation is strong and early buyers have high willingness to pay."], ["Market penetration", "Uses a relatively low price to accelerate adoption, volume and market share. It is more attractive when scale matters and demand is price-sensitive."], ["Dynamic pricing", "Prices vary with time, demand, inventory, customer or context. Airlines and hotels often change prices as capacity and booking conditions evolve."], ["Price changes", "A price cut can increase volume but may trigger competitor retaliation or damage perceived quality. A price increase can improve margins but must be justified by value or market conditions."]], "example": "A new premium gadget may launch at a high price for enthusiasts and later decline. That is skimming. A ride service changing fares minute by minute is dynamic pricing.", "exam": "Skimming and dynamic pricing are not the same. Skimming is a launch/market-entry logic; dynamic pricing continuously adjusts to market conditions."}, {"id": "r13", "ch": "Ch. 13", "title": "Digital Communication and Inbound Logic", "priority": "med", "diagram": "digital", "summary": "Digital marketing creates discoverability, engagement and measurable interaction. The central distinction is between earning attention through useful content and buying attention through paid placement.", "concepts": [["Inbound logic", "Create useful content and experiences that attract people who already have a relevant need or interest, rather than interrupting everyone indiscriminately."], ["Company website", "A strong site should be easy to use, attractive and aligned with the brand. Ease of navigation and useful content affect conversion and repeat visits."], ["SEO", "Search Engine Optimization improves the probability that owned content appears high in organic, nonpaid search results."], ["SEM", "Search Engine Marketing pays search platforms for placement against selected keywords. More specific keywords often indicate stronger purchase intent."], ["Social media", "Creates a public voice, supports communities and can reinforce other communication. It is usually one part of an integrated communication system, not the whole system."]], "example": "A broad keyword like 'running shoes' can support discovery, while a specific query such as 'stability running shoe size 9' is closer to conversion intent.", "exam": "SEO = organic visibility. SEM = paid search. Do not confuse social media activity with an entire communication strategy."}, {"id": "r18", "ch": "Ch. 18", "title": "Developing New Market Offerings", "priority": "high", "diagram": "stagegate", "summary": "New-product development is a sequence of learning and commitment. Early stages test whether an idea deserves more resources; later stages build and deploy the validated offering.", "concepts": [["Stage-Gate logic", "Five broad stages: idea generation, concept development, business-model design, offering implementation, and commercial deployment. Gates screen, realign or stop weak ideas."], ["Three tests", "Desirability: do customers want it? Feasibility: can the company build/deliver it? Viability: does it create sufficient value for the company and collaborators?"], ["Alpha and beta testing", "Alpha testing evaluates the product inside the firm; beta testing places it with customers/users to surface real-world problems."], ["Diffusion of innovation", "Adoption typically moves from innovators to early adopters, early majority, late majority and laggards. Different groups have different tolerance for uncertainty and need for proof."]], "example": "A prototype may be technically feasible but still fail if customers do not value the benefit enough. Stage-Gate prevents the firm from scaling such an idea too early.", "exam": "Immediate technology enthusiasts are innovators/early adopters, not laggards. Gates are decision checkpoints, not merely project milestones."}, {"id": "rd", "ch": "Dolan", "title": "Note on Marketing Strategy — Communication Essentials", "priority": "high", "diagram": "sixm", "summary": "Communication planning must start with the decision problem and the audience, not with a favorite medium. The communication mix should fit the buying process and channel structure.", "concepts": [["6 Ms", "Market = whom? Mission = objective? Message = what to say? Media = where/how? Money = budget? Measurement = how will impact be assessed?"], ["Personal selling", "Becomes more important when the offering is complex, expensive, customized or requires education because the salesperson can diagnose needs and tailor the message."], ["Push strategy", "Focuses on intermediaries. The manufacturer persuades channel members to stock, recommend and sell the product."], ["Pull strategy", "Focuses on the end customer. Strong customer demand 'pulls' the product through the channel, making the retailer’s role mainly availability."]], "example": "A technical industrial solution may need personal selling and distributor training, while a simple branded consumer product may rely more heavily on pull advertising.", "exam": "Mission is the communication objective, not the corporate mission. Measurement is how impact will be evaluated after the campaign."}];


function readingDiagram(type){
  const box=(title,sub='')=>'<div class="rd-node"><b>'+title+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div>';
  const arrow='<div class="rd-arrow">→</div>';
  if(type==='orientation') return '<div class="rd-diagram"><div class="rd-flow">'+
    box('Production','availability + low cost')+arrow+box('Product','better features')+arrow+
    box('Selling','push + persuasion')+arrow+box('Marketing','start with needs')+arrow+
    box('Market Value','customer + company + collaborators')+'</div>'+
    '<div class="rd-wheel"><span>Relationship</span><span>Integrated</span><span>Internal</span><span>Performance</span><b>HOLISTIC<br>MARKETING</b></div></div>';
  if(type==='gstic') return '<div class="rd-diagram"><div class="rd-flow">'+
    box('G','Goal')+arrow+box('S','Strategy')+arrow+box('T','Tactics')+arrow+box('I','Implementation')+arrow+box('C','Control')+
    '</div><div class="rd-caption">Strategy = Target Market + Value Proposition &nbsp; | &nbsp; Tactics = Product · Service · Brand · Price · Incentives · Communication · Distribution</div></div>';
  if(type==='consumer') return '<div class="rd-diagram"><div class="rd-flow">'+box('Problem Recognition')+arrow+box('Information Search')+arrow+box('Evaluate Alternatives')+arrow+box('Purchase')+arrow+box('Postpurchase')+'</div>'+
    '<div class="risk-grid"><span>Functional</span><span>Physical</span><span>Financial</span><span>Social</span><span>Psychological</span><span>Time / Effort</span></div></div>';
  if(type==='buyingcenter') return '<div class="rd-diagram"><div class="buying-map"><b>Buying Centre</b><span>Initiator</span><span>User</span><span>Influencer</span><span>Decider</span><span>Buyer</span><span>Gatekeeper</span></div>'+
    '<div class="rd-caption">One person can play multiple roles; one role can also be shared by several people.</div></div>';
  if(type==='research') return '<div class="rd-diagram"><div class="rd-flow">'+box('1','Define problem')+arrow+box('2','Research plan')+arrow+box('3','Collect')+arrow+box('4','Analyze')+arrow+box('5','Decide')+'</div>'+
    '<div class="method-grid"><div><b>Cluster</b><small>Who belongs together?</small></div><div><b>Conjoint</b><small>What attributes are valued?</small></div><div><b>Qualitative</b><small>Why do people think/act this way?</small></div></div></div>';
  if(type==='stp') return '<div class="rd-diagram"><div class="rd-flow">'+box('Segment','divide heterogeneous market')+arrow+box('Target','choose whom to serve')+arrow+box('Profile','make target actionable')+arrow+box('Position','own a distinct mental space')+'</div>'+
    '<div class="seg-quad"><span>Demographic<br><small>WHO</small></span><span>Geographic<br><small>WHERE</small></span><span>Behavioral<br><small>WHAT</small></span><span>Psychographic<br><small>WHY</small></span></div></div>';
  if(type==='position') return '<div class="rd-diagram"><div class="position-stack">'+
    '<div><b>1. Frame of Reference</b><small>Who are we compared with?</small></div>'+
    '<div><b>2. POPs</b><small>What must we have to belong?</small></div>'+
    '<div><b>3. PODs</b><small>Why should customers prefer us?</small></div>'+
    '<div><b>4. Reason to Believe</b><small>Why is the promise credible?</small></div></div></div>';
  if(type==='productmix') return '<div class="rd-diagram"><div class="mix-grid"><span><b>WIDTH</b><small># product lines</small></span><span><b>LENGTH</b><small>total items</small></span><span><b>DEPTH</b><small>variants per line</small></span><span><b>CONSISTENCY</b><small>relatedness of lines</small></span></div>'+
    '<div class="range"><b>↓ Down-market stretch</b><i>Existing range</i><b>Up-market stretch ↑</b><small>Line filling happens inside the existing range</small></div></div>';
  if(type==='brand') return '<div class="rd-diagram"><div class="brand-tree"><div class="master">Brand Architecture</div><div class="branch"><span>House of Brands</span><span>Branded House</span><span>Sub-brands</span></div></div>'+
    '<div class="rd-flow">'+box('Reposition','change meaning')+arrow+box('Extension','use brand in new category / tier')+'</div></div>';
  if(type==='pricing') return '<div class="rd-diagram"><div class="pricing-grid"><div><b>SKIMMING</b><small>High initial price<br>capture high WTP</small></div><div><b>PENETRATION</b><small>Low entry price<br>gain volume/share</small></div><div><b>DYNAMIC</b><small>Price varies with<br>time/demand/context</small></div></div></div>';
  if(type==='digital') return '<div class="rd-diagram"><div class="digital-funnel"><div>Customer Need / Search Intent</div><div><b>SEO</b> organic visibility &nbsp; | &nbsp; <b>SEM</b> paid visibility</div><div>Website / Content</div><div>Engagement → Lead → Conversion</div></div></div>';
  if(type==='stagegate') return '<div class="rd-diagram"><div class="rd-flow">'+box('Idea','desirability')+arrow+box('Concept','desirability + feasibility')+arrow+box('Business Model','+ viability')+arrow+box('Implementation')+arrow+box('Deployment')+'</div>'+
    '<div class="gate-row"><span>GATE</span><span>GATE</span><span>GATE</span><span>GATE</span></div></div>';
  if(type==='sixm') return '<div class="rd-diagram"><div class="sixm"><span><b>Market</b><small>Whom?</small></span><span><b>Mission</b><small>Objective?</small></span><span><b>Message</b><small>What?</small></span><span><b>Media</b><small>Where?</small></span><span><b>Money</b><small>How much?</small></span><span><b>Measurement</b><small>What result?</small></span></div>'+
    '<div class="pushpull"><div><b>PUSH</b><small>Firm → Intermediary → Customer</small></div><div><b>PULL</b><small>Firm → Customer demand → Channel</small></div></div></div>';
  return '';
}


function renderReadings(){
  const el=document.getElementById('panel-read');
  let h='<div class="reading-wrap"><h2 class="page">Essential Readings</h2>'+
        '<p class="read-lede">A learning-focused version of the assigned readings: the core idea, the logic behind it, a visual framework, and the distinctions worth remembering.</p>';
  READINGS.forEach(r=>{
    h+='<section class="read-sec" id="'+r.id+'">'+
       '<div class="read-head"><span class="read-ch">'+r.ch+'</span>'+
       '<div class="read-title">'+r.title+
       '<span class="priority '+r.priority+'">'+(r.priority==='high'?'Core':'Supporting')+'</span></div></div>'+
       '<p class="read-summary">'+r.summary+'</p>'+
       readingDiagram(r.diagram)+
       '<div class="learning-grid">';
    r.concepts.forEach(c=>{
      h+='<div class="learn-card"><h4>'+c[0]+'</h4><p>'+c[1]+'</p></div>';
    });
    h+='</div>'+
       '<div class="read-example"><b>Quick example</b><p>'+r.example+'</p></div>'+
       '<div class="exam-lens"><b>Keep straight</b><p>'+r.exam+'</p></div>'+
       '</section>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function renderReadingTOC(){
  const toc=document.getElementById('minitoc');
  toc.className='minitoc';
  toc.innerHTML='<b>Essential readings</b>'+READINGS.map(r=>
    '<a data-read="'+r.id+'">'+r.ch+' &nbsp;'+r.title+'</a>').join('');
  toc.querySelectorAll('[data-read]').forEach(a=>a.addEventListener('click',()=>{
    const t=document.getElementById(a.dataset.read);
    if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
  }));
}

function renderFrameworkTOC(){
  const el=document.getElementById('panel-fw');
  const toc=document.getElementById('minitoc');
  const secs=[...el.querySelectorAll('section[data-search]')];
  toc.className='minitoc';
  toc.innerHTML='<b>Frameworks</b>'+secs.map((s,i)=>
    '<a data-go="'+s.id+'">'+String(i+1).padStart(2,'0')+' &nbsp;'+
    (s.querySelector('h2')?.textContent||'Section')+'</a>'
  ).join('');
  toc.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',()=>{
    const t=document.getElementById(a.dataset.go);
    if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
  }));
}
function clearMiniTOC(){
  const toc=document.getElementById('minitoc');
  toc.className='minitoc empty';
  toc.innerHTML='';
}
function updateMiniTOC(tabId){
  if(tabId==='tab-fw') renderFrameworkTOC();
  else if(tabId==='tab-kit') renderCaseTOC();
  else if(tabId==='tab-read') renderReadingTOC();
  else clearMiniTOC();
}

/* ---------------- tabs ---------------- */
const TABS=[['tab-fw','panel-fw'],['tab-drill','panel-drill'],['tab-kit','panel-kit'],['tab-read','panel-read']];
function showTab(id){
  TABS.forEach(p=>{
    const on=p[0]===id;
    document.getElementById(p[0]).setAttribute('aria-selected',String(on));
    document.getElementById(p[1]).hidden=!on;
  });
  updateMiniTOC(id);
}
TABS.forEach(p=>{
  document.getElementById(p[0]).addEventListener('click',()=>{
    showTab(p[0]);
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

/* ---------------- boot ---------------- */
(async function(){
  renderFW();
  renderKit();
  renderReadings();
  await loadProgress();
  buildQuiz();
  updateMiniTOC('tab-fw');
})();
</script>
</body>
</html>
