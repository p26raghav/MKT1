const CJ_TABLE = {head:["Attribute","Level","Segment X","Segment Y"],
 rows:[["Price","60","2.5","1.5"],["Price","80","1.0","1.0"],["Price","100","&minus;2.0","&minus;1.5"],
       ["Packaging","Glass","1.4","0.5"],["Packaging","Refill pouch","&minus;1.4","1.0"]]};

const QS = [
/* ---------------- 2025 paper ---------------- */
{p:"2025 Q1", t:"Clustering", q:"Which of the following statements about clusters is TRUE?",
 o:["Members within a cluster are very different from each other","Members within a cluster are very similar, and clusters differ significantly from each other","Clusters always contain the exact same number of members","All the above statements are false"], a:1,
 e:"Similar inside, different across. That is the statistical restatement of a good segment. Nothing forces clusters to be equal in size, and K-means only minimises within-cluster distance."},
{p:"2025 Q2", t:"Promotion", q:"What is the core principle of inbound marketing?",
 o:["Interrupting potential customers with advertisements","Creating and sharing valuable content that attracts and engages customers","Using cold calls to generate leads","Offering discounts to all website visitors"], a:1,
 e:"Inbound pulls the customer to you through useful content. Interruption and cold calling are outbound. Its known weak point is converting attention into the final sale."},
{p:"2025 Q3", t:"B2B", q:"For enterprise clients, the decision is made by a committee of department heads, but initial contact and information flow are managed by an executive assistant to the CIO. That assistant primarily plays which buying-centre role?",
 o:["User","Buyer","Gatekeeper","Initiator"], a:2,
 e:"Controlling access and the flow of information is the gatekeeper's defining function. The assistant does not use the tool, does not negotiate terms, and did not raise the need."},
{p:"2025 Q4", t:"Product", q:"The ______ of a product mix refers to the number of product lines, while the ______ refers to the number of items within a product line.",
 o:["Width; Depth","Depth; Width","Width; Length","Length; Width"], a:0,
 e:"Width counts the lines, depth counts the items inside a line. Note that some textbooks call that second figure line length and reserve depth for variants of one item, so read the option set carefully. This paper pairs width with depth."},
{p:"2025 Q5", t:"Pricing", q:"The key difference between market-skimming and market-penetration pricing is that skimming aims to maximise ______, while penetration aims to maximise ______.",
 o:["short-term profits; long-term customer loyalty","market share; per-unit revenue","revenue from less price-sensitive customers; market share","production efficiency; brand equity"], a:2,
 e:"Skimming harvests the top of the demand curve first. Penetration buys volume and share fast, usually to pre-empt competitors, at the cost of leaving money on the table with high willingness-to-pay buyers."},
{p:"2025 Q6", t:"Perceived value", q:"Using an unbranded cosmetic product and worrying about skin reactions is an example of:",
 o:["Physical risk","Functional risk","Time risk","Social risk"], a:0,
 e:"The fear is bodily harm, which is physical risk. Functional risk would be the product simply not working. Social risk would be worrying what others think of you for using it."},
{p:"2025 Q7", t:"5Cs", q:"A European luxury automaker entering India analyses import tariffs, emission regulations and the cultural significance of car ownership among the rising middle class. Which of Dolan's 5Cs is being prioritised?",
 o:["Competition","Customers","Company","Context"], a:3,
 e:"Legal, regulatory and cultural forces that limit what is possible are all Context. Nothing here is about rival brands, the firm's own capability, or specific customer needs."},
{p:"2025 Q8", t:"B2B", q:"A corporation shifts from each subsidiary procuring its own IT hardware to headquarters negotiating one worldwide contract. What is the primary advantage sought?",
 o:["Increased supplier responsiveness to local needs","Greater purchasing power and volume discounts","Higher autonomy for subsidiary managers","Reduced risk of supply chain disruption"], a:1,
 e:"Centralised purchasing consolidates volume into leverage. The other three options are things decentralised purchasing does better, and consolidating onto one or two suppliers arguably raises disruption risk rather than lowering it."},
{p:"2025 Q9", t:"Strategy", q:"A local artisan coffee shop with skilled baristas, a cosy ambiance and customers known by name faces a new Starbucks across the street. Its best chance of survival is a ______ strategy.",
 o:["Cost Leadership","Market Penetration","Differentiation","Price war"], a:2,
 e:"It cannot win a scale fight, so cost leadership and a price war are suicide. Its assets are all sources of distinctive perceived benefit, which is differentiation, and in practice differentiation focus within a narrow local segment."},
{p:"2025 Q10", t:"5Cs", q:"An Ayurvedic startup finds urban women value chemical-free cosmetics, but its own R and D still relies on synthetic stabilisers. Which C creates the strategic tension?",
 o:["Company's internal capabilities vs customer expectations","Competitors' aggressive marketing vs collaborators' weak support","Contextual regulatory pressures vs collaborators' distribution strength","Customer segmentation vs macroeconomic slowdown"], a:0,
 e:"What the customer wants is clear. The problem is that the firm cannot currently deliver it. That is a Company against Customers gap, which is exactly the product-company fit test."},
{p:"2025 Q11", t:"Positioning", q:"On a perceptual map with axes Energy to Nutrition and For Kids to For Adults, rivals occupy nutrition-for-adults and the whole kids half. Where should a new protein biscuit position itself?",
 o:["Protein-packed energy for school kids","Energy-boost for office-goers","Nutrition-boost for the growing child","Nutrition to strengthen your body"], a:1,
 e:"Read the empty quadrant and name it in the language of both axes. Energy plus adults gives office-goers. The other three options all point into occupied space."},
{p:"2025 Q12", t:"Targeting", q:"A budget hatchback maker launches a 25 lakh electric SUV and sells it through exclusive green mobility experience centres in metro malls rather than regular dealerships. This is best described as:",
 o:["Mass marketing with broad reach","Differentiated targeting with premium positioning","Undifferentiated targeting with price competition","Cost leadership without positioning"], a:1,
 e:"A separate segment is being served with a separate mix, which is differentiated targeting, and the price point plus the exclusive channel establishes a premium position. The channel choice is itself a positioning instrument."},
{p:"2025 Q13", t:"Diffusion", q:"Paytm launched its wallet years before UPI. Consumers hesitated initially, then adoption surged after demonetisation and the pandemic. Which statement is an INCORRECT application of diffusion of innovation?",
 o:["Early adopters started using the app only after demonetisation","Late majority resisted until social proof was strong","Laggards adopted only after wallets became near-mandatory","All are correct"], a:0,
 e:"Early adopters by definition move before a mass-market trigger. If they waited for demonetisation they were not early adopters at all. The other two describe the late majority and laggards correctly."},
{p:"2025 Q14", t:"Orientations", q:"Company i says it will convince customers through a strong sales force, persuasive advertising and frequent promotions. Company ii says that if it highlights innovative features and cutting-edge technology, customers will be drawn to the best bicycle. Which option is correct?",
 o:["ii is the Marketing concept","i is the Selling concept","Both i and ii are the Product concept","None of the rest"], a:1,
 e:"Statement i is textbook selling concept, pushing existing inventory through persuasion. Statement ii is the product concept, assuming technical superiority sells itself. Neither is the marketing concept, which would start from customer need."},
{p:"2025 Q15", t:"Needs", q:"A luxury car is admired by many consumers but only a very small fraction are willing and able to buy it. Which best describes the market situation?",
 o:["Non-existent demand from a segment unaware of the product","The product satisfies a latent demand not met by existing products","The brand is a want for many people but a demand for only the few who have the ability to pay","Negative demand, as consumers dislike the high price"], a:2,
 e:"Demand is a want backed by ability and willingness to pay. Admiration without purchasing power is a want, not demand. Awareness is high, so non-existent demand is wrong, and admiration rules out negative demand."},
{p:"2025 Q16", t:"Diffusion", q:"An expensive self-charging solar scooter is bought immediately by environmentally conscious tech enthusiasts, while mainstream buyers see no advantage over cheaper conventional scooters. Which statement is INCORRECT per Rogers' model?",
 o:["Tech enthusiasts are early adopters","Mainstream buyers could be late adopters","Tech enthusiasts could be laggards","Both the second and third options"], a:2,
 e:"Laggards are the last to adopt anything. Enthusiasts who buy at launch are the opposite of laggards, so that statement is the incorrect application. The mainstream lagging behind is a normal description."},
{p:"2025 Q17", t:"Segmentation", q:"A fitness app focuses on advanced data analytics and personalised coaching for competitive marathon runners rather than all athletes. What segmentation basis is this?",
 o:["Demographic","Behavioral","Geographic","Firmographic"], a:1,
 e:"Competitive marathon running is a usage pattern and user status, which is behavioural. It is not age or gender, not a location, and firmographics apply only to organisations in B2B."},
{p:"2025 Q18", t:"B2B", q:"A pharmaceutical company launches a prescription drug for a rare disease. The sales process requires educating physicians about benefits and trial data. What is the physician's role in the buying process?",
 o:["User","Buyer","Consumer","Gatekeeper"], a:3,
 e:"The patient consumes the drug and usually pays, but nothing reaches them unless the physician prescribes it. Controlling access is the gatekeeper function, which is why pharma marketing spends so heavily on educating doctors."},
{p:"2025 Q19", t:"Perceived value", q:"A plant-based meat startup invests heavily in perfectly mimicking the taste and texture of real meat. Which factor is most likely to DECREASE perceived value for the Indian customer?",
 o:["Need for a more protein-rich diet","Cultural beliefs about vegetarianism","Certification from a food development authority","Higher frequency of meat consumption behaviour"], a:1,
 e:"For a consumer whose vegetarianism is a cultural or religious commitment, a product engineered to taste exactly like meat is a reason to avoid it, not a benefit. Context can subtract value. The other three options would raise it."},
{p:"2025 Q20", t:"Positioning", q:"A statement that explains why consumers should buy a brand instead of competitors is known as a:",
 o:["Mission Statement","Positioning Map","Unique Selling Proposition","Value Chain"], a:2,
 e:"A USP names the distinctive reason to prefer you. A mission statement is inward facing, a positioning map is a diagnostic tool, and the value chain is an internal activity model."},
{p:"2025 Q21", t:"Pricing", q:"An airline prices the same seat differently by time of booking, day of week and the passenger's historical booking data, so a last-minute business traveller pays far more than an early leisure booker. This is best known as:",
 o:["Penetration Pricing","Price skimming","Dynamic Pricing","Cost-Plus Pricing"], a:2,
 e:"Price varies continuously with demand, timing and customer data. Skimming is a launch sequence that starts high and comes down over the product's life, which is a different mechanism entirely."},
{p:"2025 Q22", t:"Orientations", q:"An organic farming startup debates defining itself as a vegetable producer or a provider of healthy living solutions. Investors push wellness packages for higher margins, founders want vegetables available at the lowest cost. Which option describes both parties?",
 o:["Investors: Selling orientation; Founder: Marketing orientation","Investors: Marketing orientation; Founder: Production Orientation","Investors: Product orientation; Founder: Marketing Orientation","Investors: Selling orientation; Founder: Product Orientation"], a:1,
 e:"The investors are defining the business by the customer benefit delivered, which is the marketing orientation. The founders are focused on efficiency, availability and lowest cost, which is the production orientation."},
{p:"2025 Q23", t:"Perceived value", q:"Apple's iPhones command premium prices in India even though cheaper Android phones offer similar specs. Customers cite design, prestige and seamless experience. What best explains perceived value here?",
 o:["Image benefits","Functional benefits","Both image and functional benefits","None of the rest"], a:2,
 e:"Prestige is an image benefit, but seamless experience and design are genuine functional and service benefits. The answer is both, which is why matching specifications on paper does not close the gap."},
{p:"2025 Q24", t:"Consumer behaviour", q:"Buying luxury goods as a status symbol reflects:",
 o:["Physiological Needs","Ego Needs","Safety Needs","Social Needs"], a:1,
 e:"Status, prestige and recognition sit at the ego or esteem level of Maslow's hierarchy. Social needs would be belonging and affection, which is a level below."},
{p:"2025 Q25", t:"Segmentation", q:"Coca-Cola uses ______ segmentation for Diet Coke targeting health-conscious consumers, and ______ segmentation when launching smaller cans for rural markets.",
 o:["Demographic; Geographic","Psychographic; Geographic","Behavioral; Geographic","Benefit; Geographic"], a:1,
 e:"Health consciousness is an attitude and value, which is psychographic. Rural against urban is geographic. Note that health consciousness is not a demographic fact and not an observed purchase behaviour."},
{p:"2025 Q26", t:"Satisfaction", q:"Consumer satisfaction depends on:",
 o:["Product features only","Performance vs Expectations","Price vs Competition","Advertising recall"], a:1,
 e:"Satisfaction is a comparison, not a level. Below expectation is dissatisfaction, level is satisfaction, above is delight. This is why a modest product can satisfy a low-expectation segment."},
{p:"2025 Q27", t:"Perceived value", q:"Windows users are reluctant to switch to iOS because of difficulty adapting to the new interface, even when iOS is discounted. What explains perceived value here?",
 o:["Higher monetary cost","Higher effort costs","Higher functional benefits","Lower switching costs"], a:1,
 e:"The discount removes monetary cost and the reluctance survives, which proves the binding constraint is the learning and switching effort. No amount of price movement fixes an effort cost."},
{p:"2025 Q28", t:"Strategy", q:"How can a marketer overcome the negative effects of commoditisation?",
 o:["Convince target consumers the firm's products are as good as competitors'","Convince target consumers the firm's products are different from competitors'","Convince target customers that the highest-priced product is no guarantee of quality","Convince target customers that all products in the market are equivalent"], a:1,
 e:"Commoditisation means competition collapses to price. The only escape is differentiation, built from service, reliability, packaging, delivery, customisation or contract structure. Claiming parity or equivalence deepens the trap."},
{p:"2025 Q29", t:"Conjoint", q:"Given the average part-worth utilities below, which segment is more price-sensitive?",
 d:CJ_TABLE, o:["Segment X","Segment Y","Both equally","Cannot be determined from the given data"], a:0,
 e:"Price sensitivity is the spread of the price part-worths. Segment X runs from 2.5 down to minus 2.0, a range of 4.5. Segment Y runs from 1.5 to minus 1.5, a range of 3.0. The wider swing means price moves utility more, so Segment X is more sensitive."},
{p:"2025 Q30", t:"Conjoint", q:"Using the same part-worth table, which packaging option works well for each segment?",
 d:CJ_TABLE, o:["Segment X: Glass, Segment Y: Refill pouch","Segment X: Refill pouch, Segment Y: Glass","Both glass","Both refill pouch"], a:0,
 e:"Take each segment's higher part-worth on the packaging attribute. X prefers glass at 1.4 against minus 1.4. Y prefers the refill pouch at 1.0 against 0.5. Aesthetics-driven professionals want glass, natural-ingredient loyalists want the biodegradable refill."},
{p:"2025 Q31", t:"B2B", q:"The VP of purchasing analyses whether to buy disposable or reusable surgical gowns. The operating-room administrator then compares competitors and makes a choice. Surgeons influence the decision retroactively by reporting satisfaction with the brand. The surgeons perform the role of the:",
 o:["decider","initiator","user","gatekeeper"], a:2,
 e:"They wear the gowns, so they are users, and their post-purchase feedback makes them influencers for the next cycle. The administrator who compares and chooses is the buyer or decider here."},
{p:"2025 Q32", t:"Strategy", q:"Which competitive strategy is most likely to induce a price war in the market?",
 o:["Cost leadership strategy","Differentiation strategy","Focus strategy","None of the rest"], a:0,
 e:"Competing on delivered cost invites rivals to retaliate on price, and low fixed differentiation plus low industry growth makes that spiral worse. Differentiation and focus deliberately move the fight away from price."},
{p:"2025 Q33", t:"Clustering", q:"A research firm collects income, age, primary reason for purchase and media habits from hundreds of luxury car buyers, and wants to identify distinct groups such as Performance Enthusiasts against Status Seekers. Which technique fits?",
 o:["Correlation analysis","Conjoint analysis","Cluster analysis","ANOVA"], a:2,
 e:"Identifying naturally occurring distinct groups inside a mixed dataset is exactly what clustering does. Correlation measures association between two variables, conjoint values attributes, ANOVA compares group means across pre-defined groups."},
{p:"2025 Q34", t:"Positioning", q:"FreshSip is entering bottled water. PureSpring promotes natural mineral content, AquaFit highlights fitness hydration. Research shows many consumers want eco-friendly packaging alongside healthy water. How should FreshSip position itself?",
 o:["Focus only on mineral content to compete with PureSpring","Emphasise eco-friendly packaging combined with health benefits","Compete solely on the lowest price in the market","Highlight fitness benefits without addressing sustainability"], a:1,
 e:"Take the unmet need that no incumbent occupies and combine it with a category point of parity. Copying an incumbent's claim puts you in their space, and lowest price abandons differentiation entirely."},

/* ---------------- 2021 paper ---------------- */
{p:"2021 Q1", t:"Segmentation", q:"A manufacturer designs a compact combined washer-dryer specifically for buyers who are short of space. This is an example of:",
 o:["Demographic segmentation","Benefit segmentation","Geographic segmentation","Loyalty segmentation"], a:1,
 e:"The group is defined by the outcome it seeks, saving space, rather than by who its members are. That is benefit or need-based segmentation."},
{p:"2021 Q2", t:"Research", q:"Which is the best listed method for capturing group customer reactions to a new positioning decision?",
 o:["Eye tracking","Focus group method","Mystery shopping","Conjoint analysis"], a:1,
 e:"A moderated group lets reactions build on each other, which is what you want when testing meaning and language. Conjoint quantifies trade-offs, eye tracking measures attention, mystery shopping evaluates service."},
{p:"2021 Q3", t:"Targeting", q:"Effective target marketing requires that marketers do NOT:",
 o:["Use demographic variables","Scatter marketing efforts","Test concepts before launch","Segment on benefits sought"], a:1,
 e:"Concentration is the entire point of targeting. Spreading resources thinly across everyone gives you insufficient presence in any segment."},
{p:"2021 Q4", t:"Positioning", q:"Consumers believe one payment brand charges higher fees than another, without having checked. This belief is an example of:",
 o:["Price skimming","Brand positioning","Reference pricing","A conjunctive decision rule"], a:1,
 e:"A belief occupying a place in the consumer's mind, accurate or not, is positioning. Positioning is perception, not engineering or accounting reality."},
{p:"2021 Q5", t:"Needs", q:"A customer explicitly asks for a car with onboard GPS. This is a:",
 o:["Latent need","Stated need","Secret need","Delight need"], a:1,
 e:"Stated needs are what the customer says out loud. Latent needs are real but unarticulated, secret needs are ones the customer will not admit, and delight needs are unexpected extras."},
{p:"2021 Q6", t:"Segmentation", q:"A cruise line separates customers by whether they come for gambling, fun, adventure or education. This is:",
 o:["Demographic segmentation","Benefit segmentation","Geographic segmentation","Behavioural segmentation"], a:1,
 e:"Each group is defined by the benefit it is seeking from the same physical product. Same ship, four different jobs to be done."},
{p:"2021 Q7", t:"Targeting", q:"Multiple broad demographic groups all seeking the same product benefit is best served by a:",
 o:["Niche market target","Mass market target","Micro segment","Rejecter strategy"], a:1,
 e:"When the benefit sought is common across broad groups there is no reason to split the offer, so a mass or undifferentiated approach fits. A niche is one narrow distinctive group."},
{p:"2021 Q8", t:"Planning", q:"A marketing plan may contain product improvement decisions, marketing effort allocation, and sales or target choices. Which single option is correct?",
 o:["Only product improvement decisions","Only marketing effort allocation","Only sales and target choices","None of the above, because the plan contains all of them"], a:3,
 e:"The plan translates analysis into decisions across all of those. When every individual option is too narrow, none of the above is the answer."},
{p:"2021 Q9", t:"Segmentation", q:"Effective market segments must be:",
 o:["Large, loyal, local and lucrative","Distinct, accessible, measurable and profitable","Visible, viable, valuable and verifiable","New, niche, near and numerous"], a:1,
 e:"Add actionable as the fifth test. Then the further considerations of size, growth, lifetime value, competition, product market fit, expectations and company capability."},
{p:"2021 Q10", t:"Product", q:"A consumer electronics firm adds a smart speaker to its product line. The principal reason is:",
 o:["To reduce manufacturing cost","To capture new markets","To simplify the portfolio","To exit an older category"], a:1,
 e:"Extending the line is a growth move. In Ansoff terms it is product development if sold to existing customers, or diversification if it also opens a new market."},
{p:"2021 Q11", t:"Targeting", q:"A retailer that serves one distinctive customer crowd with a distinctive assortment is pursuing a:",
 o:["Mass market target","Niche market","Undifferentiated strategy","Market development strategy"], a:1,
 e:"A niche or concentrated target means all resources aimed at one narrow, well-defined group, usually with a tailored assortment they cannot get elsewhere."},
{p:"2021 Q12", t:"Targeting", q:"A segment is most attractive when:",
 o:["Entry barriers are high and exit barriers are low","Entry barriers are low and exit barriers are high","Both barriers are low","Both barriers are high"], a:0,
 e:"High entry barriers keep rivals out once you are established. Low exit barriers mean you can leave cheaply if the segment disappoints. The reverse combination is the worst of both."},
{p:"2021 Q13", t:"4Ps", q:"Cost-effective transportation of products to customers is part of which P?",
 o:["Product","Price","Place","Promotion"], a:2,
 e:"Place covers distribution, channels, availability, convenience and physical movement. Anything about getting the offer to the buyer sits here."},
{p:"2021 Q14", t:"Conjoint", q:"Increasing the number of product combinations shown in a conjoint study can reduce reliability and increase task complexity. True or false?",
 o:["True","False"], a:0,
 e:"More profiles means more respondent fatigue and more inconsistent answers. More levels also demands a larger sample, and unrealistic combinations damage validity."},
{p:"2021 Q15", t:"Promotion", q:"A new robotic mop's functioning needs to be shown for buyers to understand it. Which medium fits best?",
 o:["A newspaper classified advertisement","A video blog or other demonstration medium","A radio spot","A price-off coupon"], a:1,
 e:"When comprehension depends on seeing the product work, choose a demonstrating medium. This is the same logic as a working display in a showroom for an unfamiliar appliance."},
{p:"2021 Q16", t:"Context", q:"Rising attention to vegan food among younger consumers is best classified as a:",
 o:["Fad","Trend","Seasonal effect","Promotion response"], a:1,
 e:"A trend is a durable directional shift in behaviour with visible momentum. A fad is short-lived and unpredictable, and building a strategy on one is dangerous."},
{p:"2021 Q17", t:"Branding", q:"The brand identity prism describes a brand's identity across facets such as physique, personality, culture, relationship, reflection and self-image. True or false?",
 o:["True","False"], a:0,
 e:"Kapferer's prism splits identity into an external side, physique, relationship and reflection, and an internal side, personality, culture and self-image. Reconstructed stem, the original paper's wording was abbreviated."},
{p:"2021 Q18", t:"Promotion", q:"Inbound marketing characteristically struggles with:",
 o:["Generating awareness","Producing content at scale","The final sale of the product","Reaching younger audiences"], a:2,
 e:"It attracts attention efficiently through content and discovery, and then has no strong closing mechanism, which is why it is usually paired with sales or promotion tools."},
{p:"2021 Q19", t:"Conjoint", q:"Which statement about conjoint analysis is INCORRECT?",
 o:["It estimates part-worth utilities from choices among whole bundles","It can be used to estimate willingness to pay","It is the only method that can segment respondents using demographic variables","Omitting brand as an attribute can distort the results"], a:2,
 e:"Conjoint estimates utilities. Clustering on those utilities creates the segments, and demographics are then used to profile them afterwards. This is the paper's flagged trap."},
{p:"2021 Q20", t:"Strategy", q:"For a restaurant, employee training programmes are which kind of value-chain activity?",
 o:["A primary activity","A support activity","Inbound logistics","Outbound logistics"], a:1,
 e:"Support activities are infrastructure, human resources, technology and procurement. Primary activities are inbound logistics, operations, outbound logistics, marketing and sales, and service."},

/* ---------------- written for coverage ---------------- */
{t:"Perceived value", q:"Perceived value is best written as:",
 o:["Benefits minus costs, where both are perceived","Price minus cost of production","Benefits minus price paid","Willingness to pay minus market price"], a:0,
 e:"Both terms are perceived, which is the whole point. Costs are as subjective as benefits, which is why effort, time, risk and stigma sit in the equation alongside money."},
{t:"Perceived value", q:"Which is NOT one of the four benefit categories?",
 o:["Product or functional","Service","Personnel","Procedural"], a:3,
 e:"The four are product or functional, service, personnel, and image or symbolic. Procedural is not one of them."},
{t:"Perceived value", q:"A consumer avoids a spa because of indulgence guilt and worry about being judged. Which costs are operating?",
 o:["Monetary and time","Psychological and social","Effort and monetary","Service and personnel"], a:1,
 e:"Guilt is psychological, being judged is social. Neither is fixed by a discount, which is why the strategic answer is usually to reframe the category rather than to cut price."},
{t:"Perceived value", q:"There are exactly how many fundamental routes to raising perceived value?",
 o:["One, raise quality","Two, raise benefits or lower costs","Three, product, price and promotion","Four, one per P"], a:1,
 e:"Raise perceived benefits, reduce perceived costs, or do both. Every tactic in the course maps onto one of these two levers for one named stakeholder."},
{t:"Perceived value", q:"Saying that perceived value is intersubjective means it:",
 o:["Can be measured objectively","Is purely personal interpretation","Rests on socially shared meaning","Varies only with income"], a:2,
 e:"A logo signals only because a group agrees on what it signals. Subjective is personal, intersubjective is shared, and some performance attributes really are objective."},
{t:"Perceived value", q:"Customers evaluate an offer relative to all of these EXCEPT:",
 o:["Substitutes and rival brands","The option of doing nothing","The firm's internal cost structure","Expected norms and prior experience"], a:2,
 e:"Your cost structure is invisible to the customer. Doing nothing, on the other hand, is a genuine competitor and the one most answers forget to include."},
{t:"Satisfaction", q:"A firm cannot quickly improve product performance. The cleanest way to still achieve satisfaction is to:",
 o:["Increase advertising spend","Target a segment whose expectations the product already meets","Cut the price","Extend the warranty"], a:1,
 e:"Satisfaction is performance against expectation, so you can move either term. Choosing a lower-expectation segment is the targeting answer, and it is exactly what i-mode did."},
{t:"Needs", q:"Which statement about needs and wants is correct?",
 o:["Marketers create needs, not wants","Marketers create wants by attaching an offer to an existing need","Needs and wants are synonyms","Wants exist only in luxury categories"], a:1,
 e:"Needs are underlying motives or tensions that already exist. A want is one particular way of satisfying one, shaped by culture, personality and marketing."},
{t:"Needs", q:"The job-to-be-done lens is most useful because it:",
 o:["Reduces research cost","Widens the competitor set beyond the product category","Simplifies pricing decisions","Replaces the need for segmentation"], a:1,
 e:"Ask what progress the customer is trying to make and a spa suddenly competes with gyms, resorts and physiotherapy. Defining competition by category is the standard error."},
{t:"Consumer behaviour", q:"Laddering moves in which order?",
 o:["Value, emotion, consequence, attribute","Attribute, functional consequence, emotional consequence, higher-order value","Attribute, price, brand, loyalty","Need, want, demand, purchase"], a:1,
 e:"Keep asking why is that important. Consumers open with concrete features while the real purchase driver is emotional or symbolic further up the ladder."},
{t:"Consumer behaviour", q:"Calling consumers cognitive misers means they:",
 o:["Are unwilling to spend money","Avoid unnecessary mental effort and rely on shortcuts","Cannot recall brand names","Always choose the cheapest option"], a:1,
 e:"Heuristics, emotion and context cues produce framing effects, brand shortcuts and popularity cues. So research must uncover how people decide, not how they report deciding."},
{t:"Consumer behaviour", q:"Choice overload predicts that a larger assortment can:",
 o:["Always raise conversion","Lower conversion by raising comparison difficulty and regret","Affect only low-income shoppers","Improve brand recall"], a:1,
 e:"This is the intellectual basis for a deliberately narrow assortment. Fewer options can raise clarity, confidence and purchase conversion."},
{t:"Consumer behaviour", q:"The conative component of an attitude is:",
 o:["What the consumer believes","What the consumer feels","What the consumer intends to do","What the consumer remembers"], a:2,
 e:"Cognitive is belief, affective is feeling, conative is intention. They are related but not identical, which is why belief in a product does not guarantee purchase."},
{t:"Consumer behaviour", q:"NCCS classifies Indian households using:",
 o:["Income declared on tax returns","Education of the chief wage earner and household durable ownership","Postal code and city tier","Self-reported monthly spending"], a:1,
 e:"It captures social mobility and taste better than income alone, which is why it replaced SEC. Ascribed position is inherited, achieved position is earned."},
{t:"Segmentation", q:"Good segmentation produces groups that are:",
 o:["Homogeneous across groups and heterogeneous within","Homogeneous within groups and heterogeneous across","Equal in size","Defined by demographics only"], a:1,
 e:"Similar inside, different from each other. If two groups would be marketed to identically, the cut has achieved nothing useful."},
{t:"Segmentation", q:"Which is described as the deepest and most powerful segmentation basis?",
 o:["Geographic","Demographic","Behavioural","Psychographic"], a:3,
 e:"Psychographics explain the why behind behaviour and sit closest to identity. Demographics and geography are best used to describe and locate a segment after it is defined."},
{t:"Segmentation", q:"Segmentation variables and profiling variables differ in that profiling variables:",
 o:["Create the segments","Describe the segments after they are formed","Are always psychographic","Apply only in B2B"], a:1,
 e:"Needs, attitudes, benefits sought and utilities create. Age, education, occupation, class, family size and geography describe. Reversing the two is the most common segmentation error."},
{t:"Segmentation", q:"Firmographics replace which B2C base in B2B segmentation?",
 o:["Psychographics","Demographics","Behavioural data","Geography"], a:1,
 e:"Industry, size, organised or unorganised, application and purchasing policy. Psychographics still apply in B2B, because decision makers have careers, attitudes and risk appetites."},
{t:"Segmentation", q:"Micro segmentation in B2B looks at:",
 o:["Industry and geography","Purchasing policy, risk attitude and decision-maker characteristics","Organisation size and usage rate","End use and application"], a:1,
 e:"The first, third and fourth options are macro variables. Micro segmentation goes inside the firm to how it actually buys."},
{t:"Targeting", q:"Expectation fit as a targeting criterion means:",
 o:["Customers must expect to pay a premium","The higher a segment's expectations, the harder an immature product is to place","Expectations should always be raised through advertising","Expectations are irrelevant if quality is high"], a:1,
 e:"It is the targeting consequence of the satisfaction equation, and it is why the technically obvious segment is sometimes the wrong one."},
{t:"Targeting", q:"Serving several segments with separate mixes and separate offers is:",
 o:["Undifferentiated targeting","Differentiated targeting","Concentrated targeting","Micromarketing"], a:1,
 e:"Concentrated means everything aimed at one narrow segment. Micromarketing customises down to the local or individual level."},
{t:"Diffusion", q:"The chasm sits between:",
 o:["Innovators and early adopters","Early adopters and the early majority","Early majority and late majority","Late majority and laggards"], a:1,
 e:"Early adopters tolerate flaws and enjoy novelty. The mainstream wants proof, reliability, compatibility and low risk. Most new products stall at that boundary."},
{t:"Diffusion", q:"Beyond being superior, a new product still needs all of these EXCEPT:",
 o:["Awareness and comprehension","Trial and trust","Channel support and repeat use","A lower price than the incumbent"], a:3,
 e:"Price is not on the adoption list. Compatibility is. A product can be cheaper on total cost of ownership and still fail on trial and trust."},
{t:"Positioning", q:"A point of parity is:",
 o:["The feature that makes you preferable","The category basics required to be considered at all","The evidence that you can deliver","A price matched to a competitor"], a:1,
 e:"Without POP you are not in the consideration set. POD is the reason to prefer you, RTB is the proof you can deliver on the promise."},
{t:"Positioning", q:"Reason to believe matters because:",
 o:["It sets the price ceiling","A white space with no credible support is a fantasy","It replaces concept testing","It defines the competitor set"], a:1,
 e:"Step eight of the positioning process exists precisely to kill attractive positions the firm cannot actually deliver."},
{t:"Positioning", q:"Which axis pair would be LEAST diagnostic on a perceptual map?",
 o:["Urban against off-road","Rugged against sophisticated","Poor quality against high quality","Routine against vacation"], a:2,
 e:"One end is obviously good and the other obviously bad, so nobody would choose the bad end and no brand would admit to sitting there. Good axes carry a genuine trade-off."},
{t:"Positioning", q:"Top of mind refers to:",
 o:["Any brand identified when shown a cue","The first brand recalled in a category","The brand with the highest market share","The brand most recently purchased"], a:1,
 e:"Recall is retrieval without a cue, recognition is identification with a cue, top of mind is first named. None of the three is the same as liking, preference or loyalty."},
{t:"Positioning", q:"A concept can score well on resonance and still be rejected because it fails on:",
 o:["Clarity alone","Differentiation or long-term brand equity","Price alone","Sample size"], a:1,
 e:"The seven criteria are resonance, motivation to try, repeat potential, clarity, communicability, differentiation and long-term brand equity. Appeal alone is not enough."},
{t:"Positioning", q:"When the main barrier is that the whole category is seen as elitist, indulgent or risky, the right move is to:",
 o:["Cut price below the category average","Reframe the category before differentiating within it","Exit the category","Increase advertising frequency"], a:1,
 e:"This is category positioning rather than brand positioning. Turning cellular service from a status symbol into everyday communication, or a spa from indulgence into health, are both examples."},
{t:"4Ps", q:"A pull strategy means:",
 o:["Pressuring intermediaries to stock and sell","Building end-user demand that drags the product through the channel","Discounting to clear inventory","Selling direct and removing intermediaries"], a:1,
 e:"Push works on the channel, pull works on the end customer. Which fits depends on who controls the decision, how informed the customer is, and how much channel power exists."},
{t:"4Ps", q:"Removing an intermediary from a channel:",
 o:["Removes the functions that intermediary performed","Leaves those functions to be performed by someone else","Always lowers total cost","Is required for premium positioning"], a:1,
 e:"You can cut a layer, not the tasks. Somebody still has to hold stock, educate the buyer and handle after-sale service, and that cost reappears elsewhere."},
{t:"4Ps", q:"Intermediaries gain power over the purchase decision when customers:",
 o:["Are highly informed and price sensitive","Lack technical knowledge, delegate the choice and depend on expert installation","Buy frequently in small quantities","Have many brands to choose from"], a:1,
 e:"All three conditions together make the intermediary the effective decision maker, and that is when a direct-to-consumer bypass fails."},
{t:"4Ps", q:"In the 6 Ms of communication planning, Mission refers to:",
 o:["The audience addressed","The objective of the communication","The media vehicles chosen","The budget"], a:1,
 e:"Market is the audience, mission is the objective, message is the content, media is the vehicle, money is the budget, measurement is the post-campaign assessment."},
{t:"Pricing", q:"The reference-price danger is that:",
 o:["Premium prices deter trial","A low introductory price anchors customers and makes later increases hard","Competitors will always undercut you","Discounts reduce gross margin"], a:1,
 e:"It is the strategic argument against buying volume with a launch discount, and it is why a premium innovation should usually hold price and prove value instead."},
{t:"Pricing", q:"Two tariffs with similar total expected spend can feel very different to customers. This is:",
 o:["Decoy pricing","Pricing architecture","Skimming","Price discrimination"], a:1,
 e:"A fixed monthly fee, an activation fee and a usage charge produce different perceived costs at the same total. Structure is a positioning instrument, not just arithmetic."},
{t:"Pricing", q:"Penetration pricing is most appropriate when:",
 o:["Willingness to pay is high at the top of the market","Customers are price sensitive, scale economies matter and a competitive threat exists","Capacity is severely constrained","The product is a luxury good"], a:1,
 e:"Its whole purpose is to buy share quickly and deter entrants. If capacity is constrained or the top of the market will pay, skimming is the better sequence."},
{t:"Product", q:"Cannibalisation is least worrying when:",
 o:["The new product carries a higher margin and the market is migrating anyway","The old product is the volume leader","The sales force is loyal to the old product","The new product costs more to manufacture"], a:0,
 e:"Then you would rather control the transition yourself than hand it to a competitor. Ask also whether the customer would otherwise have switched away entirely."},
{t:"Product", q:"During which product life cycle stage is defending differentiation most critical?",
 o:["Introduction","Growth","Maturity","Decline"], a:2,
 e:"Volume peaks and competitors have arrived, so the fight is about holding position. Introduction is about awareness and trial, decline is about harvesting, repositioning or exit."},
{t:"B2B", q:"Which buying situation involves the most perceived risk and the largest buying centre?",
 o:["Straight rebuy","Modified rebuy","New task","Reverse auction"], a:2,
 e:"An unfamiliar purchase pulls in more stakeholders, requires more information, and raises everyone's psychological cost. A straight rebuy is the hardest for a new supplier to break into."},
{t:"B2B", q:"A hygiene factor is:",
 o:["A benefit you can charge a premium for","Something you cannot trade away, which buys a seat but does not win the deal","A regulatory compliance requirement","A cost passed to the customer"], a:1,
 e:"On-time delivery and ease of use are the standard examples. Failing one loses the deal, meeting it wins nothing. In decision-rule terms it behaves like a conjunctive threshold."},
{t:"B2B", q:"A moment of truth is:",
 o:["The final purchase decision","Any interaction with any stakeholder that moves their perceived value","The launch date of a product","The point at which a contract is signed"], a:1,
 e:"Which is why a rude payment reminder from accounts, or a switchboard that cannot locate an engineer, is a marketing event with a real commercial cost."},
{t:"Sizing", q:"The gap between SAM and SOM is explained mainly by:",
 o:["Geography and transport cost","Competition","Production capacity","Regulatory limits"], a:1,
 e:"TAM to SAM is your own capability and structural limits. SAM to SOM is competition. With no competitors you would take your entire SAM."},
{t:"Sizing", q:"A demand that exists but appears in no current estimate belongs in:",
 o:["TAM","SAM","SOM","PAM"], a:3,
 e:"The potential addressable market is the uncharted application that standard sizing has missed, and finding one can change a forecast materially."},
{t:"Sizing", q:"Bottom-up sizing means:",
 o:["Taking the total market and applying a share","Customers times units per customer times frequency, aggregated","Asking the sales team for a target","Last year plus a growth rate"], a:1,
 e:"Strong estimates run bottom-up alongside top-down and converge on a defensible range rather than a single number."},
{t:"Research", q:"Observation is preferred over interviewing when:",
 o:["Budgets are tight","The behaviour is subconscious and respondents cannot report it","The sample is large","The category is B2B"], a:1,
 e:"People genuinely do not remember habitual micro-behaviours, and asked to describe a routine they leave them out entirely."},
{t:"Research", q:"Which is directly observable?",
 o:["Attitudes","Values","Behaviour and practices","Ideology"], a:2,
 e:"Perceptions, attitudes, beliefs, values and ideology have to be inferred or probed. Only behaviour and practices can actually be watched."},
{t:"Research", q:"Eye tracking is used to establish:",
 o:["Willingness to pay","What a viewer actually looked at, in what order","Segment membership","Service quality"], a:1,
 e:"It produces a gaze path with an entry point, a sequence and an exit, which is very different from what respondents claim to have noticed afterwards."},
{t:"Research", q:"The correct research sequence for building psychographic segments is:",
 o:["Cluster, then survey, then interview","Qualitative discovery, then quantitative measurement, then clustering, then profiling","Survey, then demographics, then qualitative","Conjoint, then demographics, then interviews"], a:1,
 e:"Qualitative discovers what matters, quantitative measures it at scale, clustering groups respondents, and demographics describe the resulting segments."},
{t:"Analytics", q:"A decision rule where one weak attribute eliminates an option entirely is:",
 o:["Compensatory","Conjunctive","Disjunctive","Lexicographic"], a:1,

function block(b){
  switch(b.t){
    case "p": return '<p>'+b.v+'</p>';
    case "h": return '<h4>'+b.v+'</h4>';
    case "list": return '<ul>'+b.v.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
    case "eg": return '<div class="eg"><b>Seen in class</b>'+b.v+'</div>';
    case "callout": return '<div class="callout'+(b.cls==='warn'?' warn':'')+'"><span class="lab">'+
      b.lab+'</span><p>'+b.v+'</p></div>';
    case "eqn": return '<div class="eqn">'+b.v+(b.s?'<small>'+b.s+'</small>':'')+'</div>';
    case "table": return tableHTML(b.head, b.rows);
    case "cards": return '<div class="cards">'+b.v.map(c=>
      '<div class="card"><span class="ct">'+c[0]+'</span><span class="cd">'+c[1]+'</span></div>').join('')+'</div>';
    case "flow": {
      let out='<div class="flow">';
      b.v.forEach((s,i)=>{
        out += '<div class="fstep">'+(s[0]?'<span class="fk">'+s[0]+'</span>':'')+
               '<span class="ft">'+s[1]+'</span><span class="fd">'+s[2]+'</span></div>';
        if(i<b.v.length-1) out += '<div class="farrow">&rarr;</div>';
      });
      return out+'</div>';
    }
    case "ledger": return '<div class="ledger"><div class="plus"><span class="lh">Benefits, what the customer gets</span><ul>'+
      b.plus.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="minus"><span class="lh">Costs, what the customer gives up</span><ul>'+
      b.minus.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>';
    case "matrix": {
      let out='<div class="matrix"><div class="mh"></div>';
      b.cols.forEach(c=>out+='<div class="mh">'+c+'</div>');
      b.rows.forEach(r=>{
        out+='<div class="mh">'+r[0]+'</div>';
        for(let i=1;i<r.length;i++) out+='<div class="mc">'+r[i][0]+'<span>'+r[i][1]+'</span></div>';
      });
      return out+'</div>';
    }
    default: return '';
  }
}
function tableHTML(head, rows){
  let out='<table><thead><tr>';
  head.forEach(h=>out+='<th>'+h+'</th>');
  out+='</tr></thead><tbody>';
  rows.forEach(r=>{ out+='<tr>'; r.forEach(c=>out+='<td>'+c+'</td>'); out+='</tr>'; });
  return out+'</tbody></table>';
}

<tr><td><b>Product</b></td><td>Technical superiority</td><td>Build the “best” product</td><td>Better engineering may not equal higher value</td></tr>
<tr><td><b>Selling</b></td><td>Existing inventory</td><td>Push the product through persuasion</td><td>Short-term sales without product-market fit</td></tr>
<tr><td><b>Marketing</b></td><td>Customer needs</td><td>Design the offering around the market</td><td>Requires deeper research and trade-offs</td></tr>
</table>
</section><section id="5cs" data-search><h2>3. The 5Cs</h2>
<div class="diagram">
<svg viewBox="0 0 760 330" aria-label="5Cs value exchange diagram">

<rect x="530" y="135" width="190" height="62" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="625" y="173" text-anchor="middle" font-size="20" font-weight="700">Collaborators</text>
<rect x="280" y="240" width="200" height="62" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="380" y="278" text-anchor="middle" font-size="20" font-weight="700">Competitors</text>
<ellipse cx="380" cy="166" rx="355" ry="152" fill="none" stroke="#a78bfa" stroke-dasharray="8 7"/><text x="630" y="316" fill="#7c3aed" font-size="18">Context surrounds all players</text>
<line x1="280" y1="70" x2="200" y2="135" stroke="#667085" marker-end="url(#a)"/><line x1="225" y1="150" x2="300" y2="88" stroke="#667085" marker-end="url(#a)"/>
<line x1="480" y1="70" x2="560" y2="135" stroke="#667085" marker-end="url(#a)"/><line x1="535" y1="150" x2="460" y2="88" stroke="#667085" marker-end="url(#a)"/>
</svg>

<div class="grid">
<div class="card"><h3>Company</h3><p>Capabilities, assets, culture, economics, right-to-win.</p></div>
<div class="card"><h3>Customers</h3><p>Needs, perceived value, buying behaviour, segments, willingness to pay.</p></div>
<div class="card"><h3>Competitors</h3><p>Who else satisfies the same need? Compare relative value, not just products.</p></div>
<div class="card"><h3>Collaborators</h3><p>Channels, suppliers, intermediaries, complementors and partners who help create value.</p></div>
<div class="card"><h3>Context</h3><p>Cultural, social, economic, technological, legal and regulatory forces.</p></div>
</div>
<div class="callout"><b>Value exchange:</b> the firm creates value for customers and captures part of it through pricing; collaborators also need a reason to participate.</div>
</section><section id="stp" data-search><h2>4. Segmentation → Targeting → Positioning (STP)</h2>
<div class="flow"><div class="node">Segment<br><span class="small">Find meaningful differences</span></div><div class="arrow">→</div><div class="node">Target<br><span class="small">Choose attractive segment(s)</span></div><div class="arrow">→</div><div class="node">Position<br><span class="small">Own a distinct idea in the mind</span></div></div>
<div class="two">
<div class="card">
<h3>B2C segmentation bases</h3>
<p><span class="badge">Geographic</span><span class="badge">Demographic</span><span class="badge">Behavioural</span><span class="badge">Psychographic</span><span class="badge">Benefit/Need</span><span class="badge">Lifestyle</span></p>
<p><b>Psychographic variables:</b> needs, attitudes, perceptions, values, personality and lifestyle.</p>
</div>
<div class="card">
<h3>B2B segmentation bases</h3>
<p><b>Macro:</b> industry, organization size, geography, end-use/application, customer type.</p>
<p><b>Micro:</b> buying situation, purchasing criteria, capabilities, policies, risk attitude and characteristics of decision participants.</p>
</div>
</div>
<h3 style="margin-top:18px">A good segment should be</h3>
<div class="grid">
<div class="card tight"><b>Distinct / Differentiable</b><br><span class="small">Different needs or responses.</span></div>
<div class="card tight"><b>Measurable / Definable</b><br><span class="small">You can identify and estimate it.</span></div>
<div class="card tight"><b>Accessible</b><br><span class="small">You can reach and serve it.</span></div>
<div class="card tight"><b>Profitable / Substantial</b><br><span class="small">Enough economic value.</span></div>
<div class="card tight"><b>Actionable</b><br><span class="small">You can build a different offering for it.</span></div>
</div>
</section><section id="targeting" data-search><h2>5. Targeting: Which Segment Should We Serve?</h2>
<div class="diagram">
<svg viewBox="0 0 760 280">
<line x1="90" y1="230" x2="690" y2="230" stroke="#344054" stroke-width="2"/>
<line x1="90" y1="230" x2="90" y2="30" stroke="#344054" stroke-width="2"/>
<text x="360" y="265" text-anchor="middle" font-size="18">Attractiveness: size, growth, profit, low rivalry</text>
<text x="26" y="135" transform="rotate(-90 26 135)" text-anchor="middle" font-size="18">Company fit / right-to-win</text>
<rect x="110" y="145" width="235" height="65" rx="12" fill="#f2f4f7"/><text x="228" y="180" text-anchor="middle" font-size="18">Avoid / deprioritize</text>
<rect x="430" y="55" width="235" height="65" rx="12" fill="#dcfce7"/><text x="548" y="90" text-anchor="middle" font-size="18" font-weight="700">Priority target</text>
<rect x="430" y="145" width="235" height="65" rx="12" fill="#fef3c7"/><text x="548" y="180" text-anchor="middle" font-size="18">Attractive, weak fit</text>
<rect x="110" y="55" width="235" height="65" rx="12" fill="#e0e7ff"/><text x="228" y="90" text-anchor="middle" font-size="18">Strong fit, small opportunity</text>
</svg>
</div>
<p>Consider segment size and growth, profitability/CLV, competition, accessibility, product-market fit, company capabilities and whether the segment’s expectations match what you can deliver.</p>
<div class="callout"><b>Expectation principle:</b> Satisfaction depends on performance relative to expectations. Performance &lt; expectation → dissatisfaction; performance ≥ expectation → satisfaction.</div>
</section><section id="needs" data-search><h2>6. Needs, Wants and Consumer Motivation</h2>
<div class="grid">
<div class="card"><h3>Need vs want</h3><p>A <b>need</b> is an underlying problem or motive. A <b>want</b> is a specific way of satisfying it. Marketing can surface latent needs and shape wants; it does not need to invent the underlying need.</p></div>
<div class="card"><h3>Job-to-be-Done</h3><p>Ask: “What progress is the customer trying to make?” Move from product category to the larger phenomenon or goal.</p></div>
<div class="card"><h3>Latent / unfelt needs</h3><p>Consumers may not articulate them directly. Observation, ethnography and laddering can uncover them.</p></div>
</div>
<div class="diagram" style="margin-top:16px">
<svg viewBox="0 0 700 330">
<polygon points="350,20 485,270 215,270" fill="#eef2ff" stroke="#3b5ccc" stroke-width="2"/>
<line x1="246" y1="215" x2="454" y2="215" stroke="#3b5ccc"/><line x1="276" y1="160" x2="424" y2="160" stroke="#3b5ccc"/><line x1="305" y1="105" x2="395" y2="105" stroke="#3b5ccc"/>
<text x="350" y="77" text-anchor="middle" font-size="17">Self-actualization</text>
<text x="350" y="135" text-anchor="middle" font-size="17">Ego / esteem</text>
<text x="350" y="190" text-anchor="middle" font-size="17">Social / belonging</text>
<text x="350" y="245" text-anchor="middle" font-size="17">Safety & security</text>
<text x="350" y="295" text-anchor="middle" font-size="17">Physiological</text>
</svg>
</div>
<h3 style="margin-top:16px">Laddering</h3>
<div class="flow"><div class="node">Attribute<br><span class="small">What?</span></div><div class="arrow">→</div><div class="node">Functional consequence<br><span class="small">So what?</span></div><div class="arrow">→</div><div class="node">Emotional benefit<br><span class="small">Why important?</span></div><div class="arrow">→</div><div class="node">Higher-order value<br><span class="small">Why does that matter?</span></div></div>
</section><section id="consumer" data-search><h2>7. Consumer Behaviour</h2>
<p>Consumer behaviour studies choices made while searching, evaluating, purchasing and using products, services and ideas. Decisions are influenced by both external social forces and internal psychology.</p>
<div class="two">
<div class="card"><h3>Sociology of consumption</h3><p>Groups, family, culture, social class, lifestyle, ideology and identity.</p></div>
<div class="card"><h3>Psychology of consumption</h3><p>Needs, personality, learning, attitude, perception and motivation.</p></div>
</div>
<div class="grid" style="margin-top:16px">
<div class="card"><h3>Cognitive misers</h3><p>People simplify decisions, use shortcuts and do not process every fact rationally.</p></div>
<div class="card"><h3>Choice overload</h3><p>More options can increase attention but reduce purchase because evaluation becomes harder.</p></div>
<div class="card"><h3>Social class & mobility</h3><p>Consumption can signal upward mobility, downward mobility, taste and cultural capital.</p></div>
<div class="card"><h3>Lifestyle</h3><p>A pattern of consumption goals and ways of living shaped by class, culture, ideology and individual preferences.</p></div>
</div>
</section><section id="attitude" data-search><h2>8. Attitude, Perception and Awareness</h2>
<div class="two">
<div class="card">
<h3>Tri-component attitude model</h3>
<table><tr><th>Component</th><th>Question</th></tr><tr><td>Cognitive</td><td>What do I think/believe?</td></tr><tr><td>Affective</td><td>What do I feel?</td></tr><tr><td>Conative</td><td>What do I intend to do?</td></tr></table>
</div>
<div class="card">
<h3>Perception</h3>
<p>How a person selects, organizes and interprets stimuli to create a meaningful picture. Positioning works through perception.</p>
<p><b>Awareness is different:</b> recall = retrieve without a cue; recognition = identify with a cue; top-of-mind = first brand recalled.</p>
</div>
</div>
<div class="callout"><b>Measure perception:</b> word association, semantic differential scales, user imagery, projective techniques, brand personality, sorting tasks and perceptual mapping.</div>
</section><section id="research" data-search><h2>9. Marketing Research: Seeing What Consumers Cannot Easily Say</h2>
<div class="grid">
<div class="card"><h3>Scientific observation</h3><p>Systematically record behaviour without questioning the consumer. Good for subconscious routines and real behaviour.</p></div>
<div class="card"><h3>Ethnography</h3><p>Immerse in the consumer’s natural context to understand behaviour, rituals, constraints and meanings.</p></div>
<div class="card"><h3>Mystery shopping</h3><p>Observe service delivery by acting like a normal customer.</p></div>
<div class="card"><h3>Eye tracking</h3><p>Measures visual attention and what people actually look at, rather than what they remember seeing.</p></div>
<div class="card"><h3>Projective techniques</h3><p>Animal/person/celebrity associations, image selection, brand-as-person, user imagery.</p></div>
<div class="card"><h3>Qualitative → Quantitative</h3><p>Use qualitative work to discover variables; then quantify them through surveys, conjoint, clustering or experiments.</p></div>
</div>
</section><section id="decisionrules" data-search><h2>10. Measuring Perceived Value & Decision Rules</h2>
<div class="two">
<div class="card"><h3>Direct measures</h3><p>Willingness to pay, ratings, rankings, importance scales and constant-sum allocation.</p></div>
<div class="card"><h3>Problem with direct importance</h3><p>People may say everything is important. Real choices require trade-offs, so inferred methods can be more realistic.</p></div>
</div>
<h3 style="margin-top:16px">Decision rules</h3>
<table>
<tr><th>Rule</th><th>Logic</th></tr>
<tr><td>Compensatory</td><td>A weakness on one attribute can be offset by strength on another; weighted total score.</td></tr>
<tr><td>Conjunctive</td><td>Reject if any important attribute falls below a minimum cut-off.</td></tr>
<tr><td>Disjunctive</td><td>Accept if the option excels above a cut-off on at least one key attribute.</td></tr>
<tr><td>Lexicographic</td><td>Choose the best option on the single most important attribute.</td></tr>
<tr><td>Affect referral</td><td>Use overall stored liking instead of re-evaluating attributes.</td></tr>
</table>
</section><section id="conjoint" data-search><h2>11. Conjoint Analysis</h2>
<div class="eq">Utility(product) = Σ Part-worth utility of each attribute level</div>
<div class="flow"><div class="node">Choose attributes & levels</div><div class="arrow">→</div><div class="node">Create realistic product profiles</div><div class="arrow">→</div><div class="node">Collect ratings / choices</div><div class="arrow">→</div><div class="node">Estimate part-worths</div><div class="arrow">→</div><div class="node">Predict choice / WTP</div></div>
<div class="grid" style="margin-top:16px">
<div class="card"><h3>What it answers</h3><p>Relative importance of attributes, utility of levels, willingness to pay, likely preference and market-share simulation.</p></div>
<div class="card"><h3>Why it works</h3><p>Customers evaluate bundles and make trade-offs instead of separately declaring every feature important.</p></div>
<div class="card"><h3>Estimation intuition</h3><p>Regression or choice models infer the coefficient/part-worth associated with each level from repeated evaluations.</p></div>
<div class="card"><h3>Limits</h3><p>Too many attributes/levels increase task complexity; unrealistic profiles or poor attribute selection weaken validity.</p></div>
</div>
</section><section id="cluster" data-search><h2>12. Psychographic Segmentation with Cluster Analysis</h2>
<div class="flow"><div class="node">Exploratory qualitative research</div><div class="arrow">→</div><div class="node">Large-scale survey</div><div class="arrow">→</div><div class="node">Cluster analysis</div><div class="arrow">→</div><div class="node">Label segments</div><div class="arrow">→</div><div class="node">Profile segments</div></div>
<div class="diagram" style="margin-top:16px">
<svg viewBox="0 0 760 330">
<line x1="70" y1="280" x2="700" y2="280" stroke="#344054"/><line x1="70" y1="280" x2="70" y2="40" stroke="#344054"/>
<g fill="#3b5ccc"><circle cx="160" cy="210" r="8"/><circle cx="180" cy="200" r="8"/><circle cx="150" cy="180" r="8"/><circle cx="205" cy="225" r="8"/></g>
<g fill="#7c3aed"><circle cx="480" cy="105" r="8"/><circle cx="520" cy="120" r="8"/><circle cx="555" cy="95" r="8"/><circle cx="500" cy="78" r="8"/></g>
<circle cx="175" cy="205" r="18" fill="none" stroke="#0f766e" stroke-width="3"/><circle cx="515" cy="100" r="18" fill="none" stroke="#0f766e" stroke-width="3"/>
<text x="175" y="250" text-anchor="middle">Cluster centroid</text><text x="515" y="155" text-anchor="middle">Cluster centroid</text>
<text x="360" y="315" text-anchor="middle">Psychographic variable 1</text><text x="23" y="160" transform="rotate(-90 23 160)" text-anchor="middle">Psychographic variable 2</text>
</svg>
</div>
<p><b>K-means intuition:</b> minimize distance of members from their own cluster centroid while keeping clusters meaningfully different. Outputs include <b>cluster centroids</b> and <b>cluster membership</b>.</p>
<div class="callout"><b>Important distinction:</b> variables that create the segments are not the same as profiling variables. Demographics, usage, occupation etc. are often used after clustering to describe and reach the segments.</div>
</section><section id="positioning" data-search><h2>13. Positioning & Perceptual Maps</h2>
<p><b>Positioning</b> is the deliberate creation of a distinct place for the offering in the target customer’s mind relative to alternatives.</p>
<div class="flow"><div class="node">Define competition set</div><div class="arrow">→</div><div class="node">Understand target needs</div><div class="arrow">→</div><div class="node">Map current perceptions</div><div class="arrow">→</div><div class="node">Find white space</div><div class="arrow">→</div><div class="node">Check RTB</div><div class="arrow">→</div><div class="node">Test positioning concept</div></div>
<div class="diagram" style="margin-top:16px">
<svg viewBox="0 0 720 390">
<line x1="85" y1="320" x2="650" y2="320" stroke="#344054" stroke-width="2"/>
<line x1="85" y1="320" x2="85" y2="50" stroke="#344054" stroke-width="2"/>
<text x="365" y="365" text-anchor="middle" font-size="18">Attribute / identity dimension A →</text>
<text x="25" y="185" transform="rotate(-90 25 185)" text-anchor="middle" font-size="18">Dimension B →</text>
<circle cx="220" cy="230" r="28" fill="#c7d2fe"/><text x="220" y="236" text-anchor="middle">A</text>
<circle cx="305" cy="205" r="28" fill="#c7d2fe"/><text x="305" y="211" text-anchor="middle">B</text>
<circle cx="405" cy="250" r="28" fill="#c7d2fe"/><text x="405" y="256" text-anchor="middle">C</text>
<rect x="485" y="75" width="130" height="95" rx="16" fill="#dcfce7" stroke="#0f766e" stroke-dasharray="8 6"/><text x="550" y="115" text-anchor="middle" font-weight="700">White space</text><text x="550" y="140" text-anchor="middle" font-size="14">Potential position</text>
</svg>
</div>
<div class="two">
<div class="card"><h3>Point of Parity (POP)</h3><p>Category basics you must share with competitors so customers recognize you as a credible member of the category.</p></div>
<div class="card"><h3>Point of Difference (POD)</h3><p>Meaningful benefit or association that makes you distinct and preferable.</p></div>
</div>
<div class="callout"><b>Reason to Believe (RTB):</b> the actual product/service must credibly deliver the promised position.</div>
</section><section id="advantage" data-search><h2>14. Competitive Advantage</h2>
<div class="two">
<div class="card"><h3>Value route</h3><div class="eq">V₁ &gt; V₂</div><p>Create higher customer value than the relevant alternative.</p></div>
<div class="card"><h3>Two broad strategies</h3><p><b>Cost leadership:</b> lower delivered cost.<br><b>Differentiation:</b> higher perceived benefits.<br>Both can be applied broadly or to a focused niche.</p></div>
</div>
<h3 style="margin-top:16px">Porter competitive strategy matrix</h3>
<table>
<tr><th></th><th>Low cost</th><th>Differentiation</th></tr>
<tr><th>Total market</th><td>Cost leadership</td><td>Differentiation</td></tr>
<tr><th>Niche / focused market</th><td>Cost focus</td><td>Differentiation focus</td></tr>
</table>
<h3 style="margin-top:16px">Ansoff growth matrix</h3>
<table>
<tr><th></th><th>Existing products</th><th>New products</th></tr>
<tr><th>Existing markets</th><td>Market penetration</td><td>Product development</td></tr>
<tr><th>New markets</th><td>Market development</td><td>Diversification</td></tr>
</table>
<div class="grid" style="margin-top:16px">
<div class="card"><h3>Blue Ocean</h3><p>Create a new competitive space instead of fighting head-on in a crowded red ocean.</p></div>
<div class="card"><h3>VRIO</h3><p>Advantage is more sustainable if resources/capabilities are <b>Valuable, Rare, hard to Imitate, and Organized</b> to capture value.</p></div>
<div class="card"><h3>System advantage</h3><p>A chain of reinforcing activities is harder to copy than one isolated feature.</p></div>
</div>
</section><section id="valuechain" data-search><h2>15. Value Chain</h2>

<p>Competitive advantage often comes from the <b>fit among activities</b>. Copying one visible activity may fail if the rest of the system is different.</p>
</section><section id="marketsizing" data-search><h2>16. Market Sizing & Marketing Planning</h2>
<div class="diagram">
<svg viewBox="0 0 720 360">
<circle cx="360" cy="180" r="145" fill="#eef2ff" stroke="#3b5ccc"/><circle cx="360" cy="180" r="105" fill="#e0e7ff" stroke="#3b5ccc"/><circle cx="360" cy="180" r="62" fill="#c7d2fe" stroke="#3b5ccc"/>
<text x="360" y="70" text-anchor="middle" font-size="19" font-weight="700">TAM</text><text x="360" y="125" text-anchor="middle" font-size="19" font-weight="700">SAM</text><text x="360" y="187" text-anchor="middle" font-size="19" font-weight="700">SOM</text>
<text x="535" y="115" font-size="14">Total Addressable Market</text><text x="505" y="180" font-size="14">Serviceable Addressable Market</text><text x="458" y="230" font-size="14">Serviceable Obtainable Market</text>
</svg>
</div>
<div class="two">
<div class="card"><h3>Top-down</h3><p>Start with total market demand → narrow by geography/capability → apply realistic obtainable share.</p></div>
<div class="card"><h3>Bottom-up</h3><p>Start with customers, units, frequency and account-level demand → aggregate.</p></div>
</div>
<p><b>PAM (Potential Addressable Market)</b> can represent new, uncharted segments not yet captured in standard market estimates.</p>
<div class="callout"><b>Marketing plan:</b> translate analysis into volume/demand expectations and budgets across product, price, place and promotion.</div>
</section><section id="b2b" data-search><h2>17. B2B Buying Center</h2>
<div class="grid">
<div class="card"><h3>Initiator</h3><p>Recognizes the need or starts the process.</p></div>
<div class="card"><h3>User</h3><p>Actually uses the product/service.</p></div>
<div class="card"><h3>Influencer</h3><p>Shapes specifications or evaluation criteria.</p></div>
<div class="card"><h3>Decider</h3><p>Has authority over the final choice.</p></div>
<div class="card"><h3>Buyer</h3><p>Handles commercial terms and purchase process.</p></div>
<div class="card"><h3>Gatekeeper</h3><p>Controls access and flow of information.</p></div>
</div>
<div class="callout"><b>Key B2B lesson:</b> the “customer” is often not one person. Map each participant’s goals, risks, power and evaluation criteria.</div>
</section><section id="4ps" data-search><h2>18. The 4Ps: Execution of Strategy</h2>
<table>
<tr><th>P</th><th>What it controls</th><th>Typical questions</th></tr>
<tr><td><b>Product</b></td><td>Features, bundle, brand, design, service</td><td>Which benefits are we delivering? What should be included/excluded?</td></tr>
<tr><td><b>Price</b></td><td>Value capture, tariff structure, discounting, reference price</td><td>What is WTP? What is fixed vs variable? Skim vs penetration?</td></tr>
<tr><td><b>Place</b></td><td>Distribution, channels, availability, convenience</td><td>Where should it be sold? Through whom? What role does the intermediary play?</td></tr>
<tr><td><b>Promotion</b></td><td>Communication, awareness, persuasion, education</td><td>Push or pull? Which medium best demonstrates the benefit?</td></tr>
</table>
<div class="two" style="margin-top:16px">
<div class="card"><h3>Push</h3><p>Influence intermediaries to recommend/sell the product.</p></div>
